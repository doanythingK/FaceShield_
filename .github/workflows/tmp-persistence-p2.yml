name: Temporary Persistence P2 Verification

on:
  push:
    branches:
      - refactor/ownership-workspace-hardening

permissions:
  contents: write

jobs:
  windows_verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply P2 patch
        run: python scripts/.tmp-apply-persistence-p2.py
      - name: Diff check
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore
        run: dotnet restore FaceShield.csproj
      - name: Release build
        run: dotnet build FaceShield.csproj -c Release --no-restore
      - name: Persistence P2 harness
        shell: pwsh
        run: pwsh -NoProfile -File scripts/.tmp-verify-persistence-p2.ps1
      - name: Existing focused regressions
        shell: pwsh
        run: |
          if (Test-Path scripts/verify-face-track-postprocess.ps1) {
            pwsh -NoProfile -File scripts/verify-face-track-postprocess.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (Test-Path scripts/verify-export-quality-presets.ps1) {
            pwsh -NoProfile -File scripts/verify-export-quality-presets.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  macos_verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply P2 patch
        run: python scripts/.tmp-apply-persistence-p2.py
      - name: Diff check
        run: git diff --check
      - name: Restore
        run: dotnet restore FaceShield.csproj
      - name: Release build
        run: dotnet build FaceShield.csproj -c Release --no-restore
      - name: Persistence P2 harness
        shell: pwsh
        run: pwsh -NoProfile -File scripts/.tmp-verify-persistence-p2.ps1

  commit_fix:
    if: github.actor != 'github-actions[bot]'
    needs: [windows_verify, macos_verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified patch
        run: python scripts/.tmp-apply-persistence-p2.py
      - name: Remove temporary verification files
        run: |
          rm -f scripts/.tmp-apply-persistence-p2.py
          rm -f scripts/.tmp-verify-persistence-p2.ps1
          rm -f .github/workflows/tmp-persistence-p2.yml
      - name: Verify final diff
        run: |
          git diff --check
          git status --short
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Services/Workspace/WorkspacePersistenceCoordinator.cs Services/Workspace/WorkspaceStateStore.cs scripts/.tmp-apply-persistence-p2.py scripts/.tmp-verify-persistence-p2.ps1 .github/workflows/tmp-persistence-p2.yml
          git commit -m 'Reduce persistence UI and state lock contention'
          git push origin HEAD:refactor/ownership-workspace-hardening
