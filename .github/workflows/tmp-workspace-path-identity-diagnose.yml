name: Temporary Workspace Path Identity Diagnostics

on:
  push:
    branches:
      - refactor/ownership-workspace-hardening
    paths:
      - scripts/tmp-diagnose-workspace-path-patch.py
      - .github/workflows/tmp-workspace-path-identity-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Relax diagnostic assertion
        run: python scripts/tmp-diagnose-workspace-path-patch.py
      - name: Apply patch and print remainder
        run: python scripts/tmp-fix-workspace-path-identity.py
      - name: Show remaining duplicate path policy uses
        run: |
          grep -nE 'FilePathComparison|FilePathComparer' ViewModels/Pages/HomePageViewModel.cs || true
      - name: Build patched tree
        run: |
          dotnet restore FaceShield.sln
          dotnet build FaceShield.sln -c Release --no-restore
