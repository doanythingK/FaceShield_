          write_lines(path, lines)

          # Document exactly what this change and its selected verification cover.
          doc = Path('QUALITY_STABILIZATION_REVIEW_FIXES.md')
          existing = doc.read_bytes().decode('utf-8-sig')
          nl = '\r\n' if '\r\n' in existing[-2000:] else '\n'
          heading = '## Follow-up: Auto cancellation and stored-mask lifetime (2026-09-04)'
          if heading not in existing:
              section = f'''\n---\n\n{heading}\n\nA source re-review of `docs/manual-blur-player-architecture` found four remaining hardening gaps.\n\n### Changes\n\n- `AutoMaskGenerator.GenerateAsync()` now rethrows caller cancellation instead of swallowing `OperationCanceledException`, so Workspace cannot infer that transactional post-processing committed after a cancelled rollback.\n- sparse tracking materialization now accepts the pipeline `CancellationToken`; the pipeline fault/cancellation state is checked before materialization, materialization/matching/interpolation loops check cancellation, provider writes check immediately before commit, and scene-cut transition propagation is cancellable.\n- sequential, single-detector pipelined, and parallel ordered bulk writers now check their run/pipeline token immediately before `FrameMaskProvider.SetFaceRects()`. This narrows the cooperative cancellation commit boundary but does not eliminate the unavoidable race where cancellation happens immediately after the final token check.\n- stored bitmap reads now have independent clone/snapshot APIs under `_stateGate`. Preview and export use a per-read clone, workspace persistence uses a deep-copy snapshot and disposes it after PNG persistence. Existing mutation methods may therefore dispose provider-owned bitmaps without invalidating these migrated readers.\n\n### Verification added\n\n- `scripts/verify-runtime-hardening.ps1` now enforces the cancellation propagation/commit-boundary and safe stored-bitmap read contracts.\n- `scripts/verify-automask-sparse-materialize-scene-cut.ps1` now invokes the extracted sparse materializer and verifies that a pre-cancelled token throws before materializing provider state.\n\n### Validation scope\n\nThe final commit is created only after the temporary Ubuntu workflow successfully runs the two scripts above. This selected verifier/harness run is not a Windows/macOS production build and is not a real-video runtime replay. No claim is made here for long-video behavior, forced `Dispose()` race reproduction, cancellation timing reproduction, or native-fault reproduction.\n'''
