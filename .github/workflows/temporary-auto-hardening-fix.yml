name: Temporary Auto Hardening Fix

on:
  push:
    branches:
      - docs/manual-blur-player-architecture

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted patch
        id: apply_patch
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/temporary_apply_auto_hardening.py')
          text = path.read_text()

          replacements = [
              (
                  'catch_idx = find(lines, "catch (OperationCanceledException) when (ct.IsCancellationRequested)")',
                  'generate_async = find(lines, "public async Task GenerateAsync(")\ncatch_idx = find_next(lines, "catch (OperationCanceledException) when (ct.IsCancellationRequested)", generate_async, 500)'
              ),
              (
                  'bridge_call = find(lines, "CanBridgeSparseResults(")',
                  'bridge_call = find_next(lines, "CanBridgeSparseResults(", next_call, 40)'
              ),
              (
                  'find_loop = find_next(lines, "for (int i = startKeyIndex;", find_next_method, 50)',
                  'find_loop = find_next(lines, "for (int i = startIndex;", find_next_method, 50)'
              ),
              (
                  'can_sig_end = find_next(lines, "double sceneCutDifferenceThreshold)", can_bridge_method, 20)',
                  'can_sig_end = find_next(lines, "double sceneCutThreshold)", can_bridge_method, 20)'
              ),
              (
                  'lines[can_sig_end] = lines[can_sig_end].replace("double sceneCutDifferenceThreshold)", "double sceneCutDifferenceThreshold,")',
                  'lines[can_sig_end] = lines[can_sig_end].replace("double sceneCutThreshold)", "double sceneCutThreshold,")'
              ),
              (
                  'after_entries = find_next(lines, "public IReadOnlyCollection<KeyValuePair<int, FaceMaskData>> GetFaceMaskEntries()", get_entries, 80)',
                  'after_entries = find_next(lines, "public FrameMaskProvider CreateSnapshot()", get_entries, 80)'
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise RuntimeError(f'Expected one patch locator, found {text.count(old)} for: {old}')
              text = text.replace(old, new)

          start = text.index('if any(line.strip() for line in lines[brace_idx + 1 : close_idx]):')
          end = text.index('\n\nseq_start =', start)
          text = text[:start] + '''if not any("throw;" in line for line in lines[brace_idx + 1 : close_idx]):
              indent = lines[brace_idx][: len(lines[brace_idx]) - len(lines[brace_idx].lstrip())] + "    "
              lines[brace_idx + 1 : close_idx] = [indent + "throw;" + eol(lines[brace_idx])]''' + text[end:]

          old = '''stop_if = find(lines, "if (!canBridge &&")
          if "ThrowIfCancellationRequested" not in lines[stop_if - 1]:
              insert_before(lines, stop_if, "cancellationToken.ThrowIfCancellationRequested();")'''
          new = '''scene_cut_probe = find(lines, "int nextKey =")
          if "ThrowIfCancellationRequested" not in lines[scene_cut_probe - 1]:
              insert_before(lines, scene_cut_probe, "cancellationToken.ThrowIfCancellationRequested();")'''
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one stale scene-cut insertion block, found {text.count(old)}')
          text = text.replace(old, new)

          old = '''interp = find(lines, "? InterpolateSparseResult(current, nextPositive!, frame)")
          lines[interp] = lines[interp].replace(
              "InterpolateSparseResult(current, nextPositive!, frame)",
              "InterpolateSparseResult(current, nextPositive!, frame, cancellationToken)",
          )'''
          new = '''interp_call = find(lines, "? InterpolateSparseResult(")
          interp_frame = find_next(lines, "frame)", interp_call, 8)
          nl = eol(lines[interp_frame])
          indent = lines[interp_frame][: len(lines[interp_frame]) - len(lines[interp_frame].lstrip())]
          lines[interp_frame] = lines[interp_frame].replace("frame)", "frame,")
          lines.insert(interp_frame + 1, indent + "cancellationToken)" + nl)'''
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one stale interpolation call block, found {text.count(old)}')
          text = text.replace(old, new)

          old = 'block_end = find_next(lines, "}", stored + 1, 12)'
          new = 'face_data = find_next(lines, "if (provider.TryGetFaceMaskData(frameIndex, out var faceData))", stored, 24)\nblock_end = face_data'
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one preview block locator, found {text.count(old)}')
          text = text.replace(old, new)
          old = 'lines[stored : block_end + 1] = replacement'
          new = 'lines[stored:block_end] = replacement'
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one preview replacement slice, found {text.count(old)}')
          text = text.replace(old, new)

          path.write_text(text)
          PY
          python3 scripts/temporary_apply_auto_hardening.py 2>&1 | tee temporary-patch.log
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-runtime-hardening.ps1')
          text = path.read_text()
          old = "Assert-Match \"aborted bitmap snapshot copy disposes its uncommitted bitmap\" $frameMaskProvider 'CloneBitmap\\([\\s\\S]{0,1200}catch[\\s\\S]{0,120}copy\\.Dispose\\(\\)[\\s\\S]{0,80}throw;'"
          new = "Assert-Match \"aborted bitmap snapshot copy disposes its uncommitted bitmap\" $frameMaskProvider 'private\\s+static\\s+WriteableBitmap\\s+CloneBitmap\\([\\s\\S]{0,1800}catch[\\s\\S]{0,160}copy\\.Dispose\\(\\)[\\s\\S]{0,120}throw;'"
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one bitmap-copy verifier assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

      - name: Check patch shape
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git status --short

      - name: Run runtime hardening source verifier
        id: runtime_verify
        shell: bash
        run: |
          set -o pipefail
          pwsh -File ./scripts/verify-runtime-hardening.ps1 2>&1 | tee temporary-runtime-verify.log

      - name: Run sparse materialization harness
        id: sparse_verify
        shell: bash
        run: |
          set -o pipefail
          pwsh -File ./scripts/verify-automask-sparse-materialize-scene-cut.ps1 2>&1 | tee temporary-sparse-verify.log

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f temporary-patch.log temporary-runtime-verify.log temporary-sparse-verify.log
          git rm -f --ignore-unmatch temporary-patch-error.txt
          git rm .github/workflows/temporary-auto-hardening-fix.yml scripts/temporary_apply_auto_hardening.py
          git add Services/Analysis/AutoMaskGenerator.cs \
                  Services/Analysis/SparseTrackingMaterializer.cs \
                  Services/Video/FrameMaskProvider.cs \
                  Services/Video/VideoFrameProcessingPolicy.cs \
                  Services/Workspace/WorkspaceStateStore.cs \
                  ViewModels/Workspace/FramePreviewViewModel.cs \
                  scripts/verify-runtime-hardening.ps1 \
                  scripts/verify-automask-sparse-materialize-scene-cut.ps1 \
                  QUALITY_STABILIZATION_REVIEW_FIXES.md
          git diff --cached --check
          git commit -m "Harden Auto cancellation and stored mask reads"
          git push origin HEAD:docs/manual-blur-player-architecture

      - name: Publish diagnostics
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          : > temporary-patch-error.txt
          for file in temporary-patch.log temporary-runtime-verify.log temporary-sparse-verify.log; do
            if [ -f "$file" ]; then
              echo "===== $file =====" >> temporary-patch-error.txt
              cat "$file" >> temporary-patch-error.txt
              echo >> temporary-patch-error.txt
            fi
          done
          if [ ! -s temporary-patch-error.txt ]; then
            echo "Workflow failed before producing a diagnostic log." > temporary-patch-error.txt
          fi
          git add temporary-patch-error.txt
          git commit -m "chore: capture auto hardening verification failure" || true
          git push origin HEAD:docs/manual-blur-player-architecture || true
