name: Temporary Auto Hardening Fix

on:
  push:
    branches:
      - docs/manual-blur-player-architecture

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted source and verification patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import date

          def read_lines(path):
              return Path(path).read_bytes().decode('utf-8-sig').splitlines(keepends=True)

          def write_lines(path, lines):
              Path(path).write_bytes(''.join(lines).encode('utf-8'))

          def eol(line):
              return '\r\n' if line.endswith('\r\n') else '\n'

          def find(lines, needle, start=0, end=None):
              if end is None:
                  end = len(lines)
              hits = [i for i in range(start, end) if needle in lines[i]]
              if len(hits) != 1:
                  raise RuntimeError(f"Expected exactly one '{needle}' in range, found {len(hits)}")
              return hits[0]

          def find_next(lines, needle, start, limit=200):
              for i in range(start, min(len(lines), start + limit)):
                  if needle in lines[i]:
                      return i
              raise RuntimeError(f"Could not find '{needle}' after line index {start}")

          def insert_before(lines, idx, text, indent=None):
              nl = eol(lines[idx])
              if indent is None:
                  indent = lines[idx][:len(lines[idx]) - len(lines[idx].lstrip())]
              lines.insert(idx, indent + text + nl)

          def insert_after_open_brace(lines, marker_idx, text):
              brace = find_next(lines, '{', marker_idx, 40)
              base_indent = lines[brace][:len(lines[brace]) - len(lines[brace].lstrip())]
              nl = eol(lines[brace])
              lines.insert(brace + 1, base_indent + '    ' + text + nl)

          # 1-3. AutoMaskGenerator cancellation contracts.
          path = 'Services/Analysis/AutoMaskGenerator.cs'
          lines = read_lines(path)

          catch_idx = find(lines, 'catch (OperationCanceledException) when (ct.IsCancellationRequested)')
          brace_idx = find_next(lines, '{', catch_idx, 4)
          close_idx = find_next(lines, '}', brace_idx + 1, 6)
          if any(line.strip() for line in lines[brace_idx + 1:close_idx]):
              if not any('throw;' in line for line in lines[brace_idx + 1:close_idx]):
                  raise RuntimeError('GenerateAsync cancellation catch is not empty and does not rethrow.')
          else:
              nl = eol(lines[brace_idx])
              indent = lines[brace_idx][:len(lines[brace_idx]) - len(lines[brace_idx].lstrip())] + '    '
              lines.insert(brace_idx + 1, indent + 'throw;' + nl)

          seq_start = find(lines, 'private void GenerateSequential(')
          seq_mask = find_next(lines, 'var tMask = Stopwatch.StartNew();', seq_start, 1200)
          seq_set = find_next(lines, '_maskProvider.SetFaceRects(', seq_mask, 12)
          if not any('ct.ThrowIfCancellationRequested();' in line for line in lines[seq_mask + 1:seq_set]):
              insert_before(lines, seq_set, 'ct.ThrowIfCancellationRequested();')

          pipe_start = find(lines, 'private void GeneratePipelinedDetectAll(')
          pipe_processed = find_next(lines, 'onFrameProcessed?.Invoke(result.Index);', pipe_start, 2200)
          pipe_set = find_next(lines, '_maskProvider.SetFaceRects(', pipe_processed, 14)
          if not any('pipelineToken.ThrowIfCancellationRequested();' in line for line in lines[pipe_processed + 1:pipe_set]):
              insert_before(lines, pipe_set, 'pipelineToken.ThrowIfCancellationRequested();')

          parallel_start = find(lines, 'private void GeneratePipelinedDetectAllParallel(')
          ordered_processed = find_next(lines, 'onFrameProcessed?.Invoke(orderedResult.Index);', parallel_start, 2600)
          ordered_set = find_next(lines, '_maskProvider.SetFaceRects(', ordered_processed, 14)
          if not any('pipelineToken.ThrowIfCancellationRequested();' in line for line in lines[ordered_processed + 1:ordered_set]):
              insert_before(lines, ordered_set, 'pipelineToken.ThrowIfCancellationRequested();')

          materialize_call = find(lines, 'var materialized = SparseTrackingMaterializer.Materialize(')
          if not any('pipeline.ThrowIfFailedOrCanceled();' in line for line in lines[max(0, materialize_call - 5):materialize_call]):
              insert_before(lines, materialize_call, 'pipeline.ThrowIfFailedOrCanceled();')
              materialize_call += 1
          if not any('pipelineToken.ThrowIfCancellationRequested();' in line for line in lines[max(0, materialize_call - 5):materialize_call]):
              insert_before(lines, materialize_call, 'pipelineToken.ThrowIfCancellationRequested();')
              materialize_call += 1

          end_arg = find_next(lines, 'materializeEndExclusive);', materialize_call, 12)
          nl = eol(lines[end_arg])
          indent = lines[end_arg][:len(lines[end_arg]) - len(lines[end_arg].lstrip())]
          lines[end_arg] = lines[end_arg].replace('materializeEndExclusive);', 'materializeEndExclusive,')
          lines.insert(end_arg + 1, indent + 'pipelineToken);' + nl)

          transition = find_next(lines, 'foreach (var transition in materialized.SceneCutTransitions)', end_arg, 20)
          trans_brace = find_next(lines, '{', transition, 3)
          if not any('pipelineToken.ThrowIfCancellationRequested();' in line for line in lines[trans_brace + 1:trans_brace + 3]):
              nl = eol(lines[trans_brace])
              indent = lines[trans_brace][:len(lines[trans_brace]) - len(lines[trans_brace].lstrip())] + '    '
              lines.insert(trans_brace + 1, indent + 'pipelineToken.ThrowIfCancellationRequested();' + nl)
          for_idx = find_next(lines, 'for (int frame = transition.SourceFrameIndex + 1;', trans_brace, 8)
          add_idx = find_next(lines, '_sceneCutStarts.Add(frame);', for_idx, 4)
          if lines[for_idx + 1].strip() != '{':
              nl = eol(lines[for_idx])
              indent = lines[for_idx][:len(lines[for_idx]) - len(lines[for_idx].lstrip())]
              body_indent = indent + '    '
              original_add = lines[add_idx].strip()
              lines[for_idx + 1:add_idx + 1] = [
                  indent + '{' + nl,
                  body_indent + 'pipelineToken.ThrowIfCancellationRequested();' + nl,
                  body_indent + original_add + nl,
                  indent + '}' + nl,
              ]

          write_lines(path, lines)

          # 2. SparseTrackingMaterializer: propagate cancellation into materialization and matching loops.
          path = 'Services/Analysis/SparseTrackingMaterializer.cs'
          lines = read_lines(path)
          if not any('using System.Threading;' in line for line in lines):
              using_idx = find(lines, 'using System.Linq;')
              nl = eol(lines[using_idx])
              lines.insert(using_idx + 1, 'using System.Threading;' + nl)

          mat = find(lines, 'internal static SparseMaterializeResult Materialize(')
          sig_end = find_next(lines, 'int endExclusive)', mat, 20)
          nl = eol(lines[sig_end])
          indent = lines[sig_end][:len(lines[sig_end]) - len(lines[sig_end].lstrip())]
          lines[sig_end] = lines[sig_end].replace('int endExclusive)', 'int endExclusive,')
          lines.insert(sig_end + 1, indent + 'CancellationToken cancellationToken = default)' + nl)
          insert_after_open_brace(lines, mat, 'cancellationToken.ThrowIfCancellationRequested();')

          keys = find(lines, 'int[] keys = results.Keys.ToArray();')
          if 'ThrowIfCancellationRequested' not in lines[keys - 1]:
              insert_before(lines, keys, 'cancellationToken.ThrowIfCancellationRequested();')

          outer = find(lines, 'for (int i = 0; i < keys.Length; i++)')
          insert_after_open_brace(lines, outer, 'cancellationToken.ThrowIfCancellationRequested();')

          key_has = find(lines, 'if (!maskProvider.HasEntry(key))')
          key_set = find_next(lines, 'maskProvider.SetFaceRects(', key_has, 8)
          if 'ThrowIfCancellationRequested' not in lines[key_set - 1]:
              insert_before(lines, key_set, 'cancellationToken.ThrowIfCancellationRequested();')

          next_call = find(lines, 'DetectionResult? nextPositive = FindNextPositiveResult(')
          max_bridge_arg = find_next(lines, 'maxBridgeFrames);', next_call, 12)
          nl = eol(lines[max_bridge_arg])
          indent = lines[max_bridge_arg][:len(lines[max_bridge_arg]) - len(lines[max_bridge_arg].lstrip())]
          lines[max_bridge_arg] = lines[max_bridge_arg].replace('maxBridgeFrames);', 'maxBridgeFrames,')
          lines.insert(max_bridge_arg + 1, indent + 'cancellationToken);' + nl)

          bridge_call = find(lines, 'CanBridgeSparseResults(')
          threshold_arg = find_next(lines, 'sceneCutThreshold);', bridge_call, 10)
          nl = eol(lines[threshold_arg])
          indent = lines[threshold_arg][:len(lines[threshold_arg]) - len(lines[threshold_arg].lstrip())]
          lines[threshold_arg] = lines[threshold_arg].replace('sceneCutThreshold);', 'sceneCutThreshold,')
          lines.insert(threshold_arg + 1, indent + 'cancellationToken);' + nl)

          stop_if = find(lines, 'if (!canBridge &&')
          if 'ThrowIfCancellationRequested' not in lines[stop_if - 1]:
              insert_before(lines, stop_if, 'cancellationToken.ThrowIfCancellationRequested();')

          inner = find(lines, 'for (int frame = key + 1; frame < segmentEnd; frame++)')
          insert_after_open_brace(lines, inner, 'cancellationToken.ThrowIfCancellationRequested();')

          interp = find(lines, '? InterpolateSparseResult(current, nextPositive!, frame)')
          lines[interp] = lines[interp].replace(
              'InterpolateSparseResult(current, nextPositive!, frame)',
              'InterpolateSparseResult(current, nextPositive!, frame, cancellationToken)')

          payload_empty = find(lines, 'if (payload.Bounds.Length == 0)')
          payload_set = find_next(lines, 'maskProvider.SetFaceRects(', payload_empty, 8)
          if 'ThrowIfCancellationRequested' not in lines[payload_set - 1]:
              insert_before(lines, payload_set, 'cancellationToken.ThrowIfCancellationRequested();')

          find_next_method = find(lines, 'private static DetectionResult? FindNextPositiveResult(')
          find_sig_end = find_next(lines, 'int maxBridgeFrames)', find_next_method, 20)
          nl = eol(lines[find_sig_end])
          indent = lines[find_sig_end][:len(lines[find_sig_end]) - len(lines[find_sig_end].lstrip())]
          lines[find_sig_end] = lines[find_sig_end].replace('int maxBridgeFrames)', 'int maxBridgeFrames,')
          lines.insert(find_sig_end + 1, indent + 'CancellationToken cancellationToken)' + nl)
          insert_after_open_brace(lines, find_next_method, 'cancellationToken.ThrowIfCancellationRequested();')
          find_loop = find_next(lines, 'for (int i = startKeyIndex;', find_next_method, 50)
          insert_after_open_brace(lines, find_loop, 'cancellationToken.ThrowIfCancellationRequested();')

          can_bridge_method = find(lines, 'private static bool CanBridgeSparseResults(')
          can_sig_end = find_next(lines, 'double sceneCutDifferenceThreshold)', can_bridge_method, 20)
          nl = eol(lines[can_sig_end])
          indent = lines[can_sig_end][:len(lines[can_sig_end]) - len(lines[can_sig_end].lstrip())]
          lines[can_sig_end] = lines[can_sig_end].replace('double sceneCutDifferenceThreshold)', 'double sceneCutDifferenceThreshold,')
          lines.insert(can_sig_end + 1, indent + 'CancellationToken cancellationToken)' + nl)
          insert_after_open_brace(lines, can_bridge_method, 'cancellationToken.ThrowIfCancellationRequested();')
          can_loop = find_next(lines, 'for (int i = 0; i < current.Bounds.Length; i++)', can_bridge_method, 120)
          insert_after_open_brace(lines, can_loop, 'cancellationToken.ThrowIfCancellationRequested();')

          interpolate_method = find(lines, 'private static DetectionResult InterpolateSparseResult(')
          interp_sig_end = find_next(lines, 'int frameIndex)', interpolate_method, 20)
          nl = eol(lines[interp_sig_end])
          indent = lines[interp_sig_end][:len(lines[interp_sig_end]) - len(lines[interp_sig_end].lstrip())]
          lines[interp_sig_end] = lines[interp_sig_end].replace('int frameIndex)', 'int frameIndex,')
          lines.insert(interp_sig_end + 1, indent + 'CancellationToken cancellationToken)' + nl)
          insert_after_open_brace(lines, interpolate_method, 'cancellationToken.ThrowIfCancellationRequested();')
          interp_loop = find_next(lines, 'for (int i = 0; i < current.Bounds.Length; i++)', interpolate_method, 100)
          insert_after_open_brace(lines, interp_loop, 'cancellationToken.ThrowIfCancellationRequested();')

          write_lines(path, lines)

          # 4. Stored bitmap lifetime: add clone/snapshot read APIs under the provider state gate.
          path = 'Services/Video/FrameMaskProvider.cs'
          lines = read_lines(path)
          try_get = find(lines, 'public bool TryGetStoredMask(')
          next_method = find_next(lines, 'public bool TryGetFaceMaskData(', try_get, 80)
          if not any('TryCloneStoredMask(' in line for line in lines):
              nl = eol(lines[next_method])
              block = [
                  '    public bool TryCloneStoredMask(\n',
                  '        int frameIndex,\n',
                  '        out WriteableBitmap mask,\n',
                  '        CancellationToken cancellationToken = default)\n',
                  '    {\n',
                  '        cancellationToken.ThrowIfCancellationRequested();\n',
                  '        lock (_stateGate)\n',
                  '        {\n',
                  '            cancellationToken.ThrowIfCancellationRequested();\n',
                  '            if (!_masks.TryGetValue(frameIndex, out var stored))\n',
                  '            {\n',
                  '                mask = null!;\n',
                  '                return false;\n',
                  '            }\n',
                  '\n',
                  '            mask = CloneBitmap(stored, cancellationToken);\n',
                  '            return true;\n',
                  '        }\n',
                  '    }\n',
                  '\n',
              ]
              block = [s.replace('\n', nl) for s in block]
              lines[next_method:next_method] = block

          get_entries = find(lines, 'public IReadOnlyCollection<KeyValuePair<int, WriteableBitmap>> GetMaskEntries()')
          after_entries = find_next(lines, 'public IReadOnlyCollection<KeyValuePair<int, FaceMaskData>> GetFaceMaskEntries()', get_entries, 80)
          if not any('GetStoredMaskSnapshot(' in line for line in lines):
              nl = eol(lines[after_entries])
              block = [
                  '    public IReadOnlyCollection<KeyValuePair<int, WriteableBitmap>> GetStoredMaskSnapshot(\n',
                  '        CancellationToken cancellationToken = default)\n',
                  '    {\n',
                  '        cancellationToken.ThrowIfCancellationRequested();\n',
                  '        lock (_stateGate)\n',
                  '        {\n',
                  '            cancellationToken.ThrowIfCancellationRequested();\n',
                  '            var snapshot = new List<KeyValuePair<int, WriteableBitmap>>(_masks.Count);\n',
                  '            try\n',
                  '            {\n',
                  '                foreach (var entry in _masks)\n',
                  '                {\n',
                  '                    cancellationToken.ThrowIfCancellationRequested();\n',
                  '                    snapshot.Add(new KeyValuePair<int, WriteableBitmap>(\n',
                  '                        entry.Key,\n',
                  '                        CloneBitmap(entry.Value, cancellationToken)));\n',
                  '                }\n',
                  '\n',
                  '                return snapshot;\n',
                  '            }\n',
                  '            catch\n',
                  '            {\n',
                  '                foreach (var entry in snapshot)\n',
                  '                    entry.Value.Dispose();\n',
                  '                throw;\n',
                  '            }\n',
                  '        }\n',
                  '    }\n',
                  '\n',
              ]
              block = [s.replace('\n', nl) for s in block]
              lines[after_entries:after_entries] = block

          write_lines(path, lines)

          # Migrate preview to the independent stored-mask clone.
          path = 'ViewModels/Workspace/FramePreviewViewModel.cs'
          lines = read_lines(path)
          stored = find(lines, 'if (provider.TryGetStoredMask(frameIndex, out var stored))')
          block_end = find_next(lines, '}', stored + 1, 12)
          nl = eol(lines[stored])
          indent = lines[stored][:len(lines[stored]) - len(lines[stored].lstrip())]
          replacement = [
              indent + 'if (provider.TryCloneStoredMask(frameIndex, out var stored))' + nl,
              indent + '{' + nl,
              indent + '    if (stored.PixelSize.Width == frame.PixelSize.Width &&' + nl,
              indent + '        stored.PixelSize.Height == frame.PixelSize.Height)' + nl,
              indent + '    {' + nl,
              indent + '        return stored;' + nl,
              indent + '    }' + nl,
              nl,
              indent + '    stored.Dispose();' + nl,
              indent + '    return null;' + nl,
              indent + '}' + nl,
          ]
          lines[stored:block_end + 1] = replacement
          write_lines(path, lines)

          # Migrate workspace save to an owned deep-copy snapshot and dispose it after PNG persistence.
          path = 'Services/Workspace/WorkspaceStateStore.cs'
          lines = read_lines(path)
          entries = find(lines, 'var entries = maskProvider.GetMaskEntries();')
          foreach_idx = find_next(lines, 'foreach (var entry in entries)', entries, 12)
          face_masks = find_next(lines, 'var faceMasks = maskProvider.GetFaceMaskEntries()', foreach_idx, 30)
          nl = eol(lines[entries])
          indent = lines[entries][:len(lines[entries]) - len(lines[entries].lstrip())]
          replacement = [
              indent + 'var entries = maskProvider.GetStoredMaskSnapshot();' + nl,
              indent + 'var indices = new List<int>(entries.Count);' + nl,
              indent + 'var indexSet = new HashSet<int>();' + nl,
              nl,
              indent + 'try' + nl,
              indent + '{' + nl,
              indent + '    foreach (var entry in entries)' + nl,
              indent + '    {' + nl,
              indent + '        indices.Add(entry.Key);' + nl,
              indent + '        indexSet.Add(entry.Key);' + nl,
              indent + '        string filePath = Path.Combine(dir, $"mask_{entry.Key}.png");' + nl,
              indent + '        SaveMask(filePath, entry.Value);' + nl,
              indent + '    }' + nl,
              indent + '}' + nl,
              indent + 'finally' + nl,
              indent + '{' + nl,
              indent + '    foreach (var entry in entries)' + nl,
              indent + '        entry.Value.Dispose();' + nl,
              indent + '}' + nl,
              nl,
          ]
          lines[entries:face_masks] = replacement
          write_lines(path, lines)

          # Migrate export to a per-frame clone whose using declaration owns the lifetime.
          path = 'Services/Video/VideoFrameProcessingPolicy.cs'
          lines = read_lines(path)
          mask_decl = find(lines, 'WriteableBitmap? mask = null;')
          if not any('WriteableBitmap? ownedStoredMask = null;' in line for line in lines[mask_decl:mask_decl + 4]):
              nl = eol(lines[mask_decl])
              indent = lines[mask_decl][:len(lines[mask_decl]) - len(lines[mask_decl].lstrip())]
              lines.insert(mask_decl + 1, indent + 'WriteableBitmap? ownedStoredMask = null;' + nl)
          try_stored = find(lines, 'if (provider.TryGetStoredMask(decodedFrameOrdinal, out var stored))')
          lines[try_stored] = lines[try_stored].replace(
              'provider.TryGetStoredMask(decodedFrameOrdinal, out var stored)',
              'provider.TryCloneStoredMask(decodedFrameOrdinal, out var stored, cancellationToken)')
          mask_assign = find_next(lines, 'mask = stored;', try_stored, 6)
          nl = eol(lines[mask_assign])
          indent = lines[mask_assign][:len(lines[mask_assign]) - len(lines[mask_assign].lstrip())]
          if not any('ownedStoredMask = stored;' in line for line in lines[try_stored:mask_assign + 2]):
              lines.insert(mask_assign, indent + 'ownedStoredMask = stored;' + nl)
          fallback = find_next(lines, 'mask = maskProvider.GetFinalMask(decodedFrameOrdinal);', try_stored, 40)
          fallback_close = find_next(lines, '}', fallback, 4)
          if not any('using var storedMaskSnapshotScope = ownedStoredMask;' in line for line in lines[fallback_close + 1:fallback_close + 5]):
              nl = eol(lines[fallback_close])
              indent = lines[fallback_close][:len(lines[fallback_close]) - len(lines[fallback_close].lstrip())]
              lines.insert(fallback_close + 1, indent + 'using var storedMaskSnapshotScope = ownedStoredMask;' + nl)
          write_lines(path, lines)

          # Runtime source invariants for the new contracts.
          path = 'scripts/verify-runtime-hardening.ps1'
          lines = read_lines(path)
          final = find(lines, 'Write-Host "Runtime hardening verification passed."')
          nl = eol(lines[final])
          block = r'''
$sparseMaterializer = Read-RepoFile "Services/Analysis/SparseTrackingMaterializer.cs"
$videoFrameProcessing = Read-RepoFile "Services/Video/VideoFrameProcessingPolicy.cs"

Assert-Match "GenerateAsync rethrows caller cancellation" $autoMask 'catch\s*\(OperationCanceledException\)\s*when\s*\(ct\.IsCancellationRequested\)\s*\{\s*throw;\s*\}'
Assert-Match "sparse materializer accepts and checks cancellation" $sparseMaterializer 'Materialize\([\s\S]{0,320}CancellationToken\s+cancellationToken\s*=\s*default[\s\S]{0,180}ThrowIfCancellationRequested\(\)[\s\S]{0,700}results\.Keys\.ToArray\(\)'
Assert-Match "sparse materializer checks cancellation in outer and inner loops" $sparseMaterializer 'for\s*\(int\s+i\s*=\s*0;\s*i\s*<\s*keys\.Length[\s\S]{0,180}ThrowIfCancellationRequested\(\)[\s\S]*for\s*\(int\s+frame\s*=\s*key\s*\+\s*1;[\s\S]{0,180}ThrowIfCancellationRequested\(\)'
Assert-Match "sparse materializer checks cancellation immediately before provider writes" $sparseMaterializer 'ThrowIfCancellationRequested\(\);\s*maskProvider\.SetFaceRects\('
Assert-Match "sparse pipeline fails or cancels before materialization" $autoMask 'pipeline\.ThrowIfFailedOrCanceled\(\);\s*pipelineToken\.ThrowIfCancellationRequested\(\);\s*var\s+materialized\s*=\s*SparseTrackingMaterializer\.Materialize'
Assert-Match "sparse pipeline passes cancellation into materializer" $autoMask 'SparseTrackingMaterializer\.Materialize\([\s\S]{0,300}materializeEndExclusive,\s*pipelineToken\)'
Assert-Match "sequential bulk writer narrows cancellation boundary before provider commit" $autoMask 'var\s+tMask\s*=\s*Stopwatch\.StartNew\(\);\s*ct\.ThrowIfCancellationRequested\(\);\s*_maskProvider\.SetFaceRects\(\s*idx'
Assert-Match "pipelined writer narrows cancellation boundary before provider commit" $autoMask 'onFrameProcessed\?\.Invoke\(result\.Index\);[\s\S]{0,220}pipelineToken\.ThrowIfCancellationRequested\(\);\s*_maskProvider\.SetFaceRects\(\s*result\.Index'
Assert-Match "parallel ordered writer narrows cancellation boundary before provider commit" $autoMask 'onFrameProcessed\?\.Invoke\(orderedResult\.Index\);[\s\S]{0,220}pipelineToken\.ThrowIfCancellationRequested\(\);\s*_maskProvider\.SetFaceRects\(\s*orderedResult\.Index'
Assert-Match "mask provider exposes state-gated independent stored-mask clone" $frameMaskProvider 'TryCloneStoredMask\([\s\S]{0,260}CancellationToken\s+cancellationToken[\s\S]{0,300}lock\s*\(_stateGate\)[\s\S]{0,420}CloneBitmap\(stored,\s*cancellationToken\)'
Assert-Match "mask provider exposes deep-copy stored-mask snapshot with cleanup" $frameMaskProvider 'GetStoredMaskSnapshot\([\s\S]{0,260}lock\s*\(_stateGate\)[\s\S]{0,1200}CloneBitmap\(entry\.Value,\s*cancellationToken\)[\s\S]{0,500}entry\.Value\.Dispose\(\)'
Assert-Match "preview consumes an independent stored-mask clone" $framePreview 'TryCloneStoredMask\(frameIndex,\s*out\s+var\s+stored\)'
Assert-NotMatch "preview no longer consumes live stored bitmap references" $framePreview 'TryGetStoredMask\(frameIndex,\s*out\s+var\s+stored\)'
Assert-Match "workspace persistence consumes and disposes stored-mask snapshot clones" $workspaceStore 'GetStoredMaskSnapshot\(\)[\s\S]{0,900}finally[\s\S]{0,260}entry\.Value\.Dispose\(\)'
Assert-NotMatch "workspace persistence no longer saves live mask entry references" $workspaceStore 'var\s+entries\s*=\s*maskProvider\.GetMaskEntries\(\)'
Assert-Match "video export owns a cloned stored mask for the frame lifetime" $videoFrameProcessing 'TryCloneStoredMask\(decodedFrameOrdinal,\s*out\s+var\s+stored,\s*cancellationToken\)[\s\S]{0,220}ownedStoredMask\s*=\s*stored[\s\S]{0,800}using\s+var\s+storedMaskSnapshotScope\s*=\s*ownedStoredMask'
Assert-NotMatch "video export no longer consumes live stored bitmap references" $videoFrameProcessing 'TryGetStoredMask\(decodedFrameOrdinal,\s*out\s+var\s+stored\)'
'''.strip('\n').splitlines()
          insert = [line + nl for line in block] + [nl]
          lines[final:final] = insert
          write_lines(path, lines)

          # Update sparse harness to call the extracted materializer and assert pre-cancelled execution is non-mutating.
          path = 'scripts/verify-automask-sparse-materialize-scene-cut.ps1'
          lines = read_lines(path)
          if not any('using System.Threading;' in line for line in lines):
              reflection_using = find(lines, 'using System.Reflection;')
              nl = eol(lines[reflection_using])
              lines.insert(reflection_using + 1, 'using System.Threading;' + nl)

          invoke_start = find(lines, 'static (int interpolated, int sceneCutStops, string sceneCutTransitions) InvokeMaterialize(')
          invoke_end = find_next(lines, 'static void AssertNoMaterializedFaces(', invoke_start, 120)
          nl = eol(lines[invoke_start])
          new_invoke = r'''static (int interpolated, int sceneCutStops, string sceneCutTransitions) InvokeMaterialize(
    AutoMaskGenerator generator,
    object results,
    CancellationToken cancellationToken = default)
{
    Type generatorType = typeof(AutoMaskGenerator);
    var provider = (FrameMaskProvider)generatorType
        .GetField("_maskProvider", BindingFlags.NonPublic | BindingFlags.Instance)!
        .GetValue(generator)!;
    var options = (AutoMaskOptions)generatorType
        .GetField("_options", BindingFlags.NonPublic | BindingFlags.Instance)!
        .GetValue(generator)!;
    Type materializerType = generatorType.Assembly.GetType(
        "FaceShield.Services.Analysis.SparseTrackingMaterializer",
        throwOnError: true)!;
    MethodInfo method = materializerType.GetMethod(
        "Materialize",
        BindingFlags.NonPublic | BindingFlags.Public | BindingFlags.Static)!;

    object result;
    try
    {
        result = method.Invoke(
            null,
            new object[] { results, provider, options, 0, 10, cancellationToken })!;
    }
    catch (TargetInvocationException ex) when (ex.InnerException is OperationCanceledException canceled)
    {
        throw canceled;
    }

    Type resultType = result.GetType();
    object transitions = resultType.GetProperty("SceneCutTransitions")!.GetValue(result)!;
    var transitionText = new List<string>();
    foreach (object transition in (System.Collections.IEnumerable)transitions)
    {
        Type transitionType = transition.GetType();
        int source = (int)transitionType.GetProperty("SourceFrameIndex")!.GetValue(transition)!;
        int next = (int)transitionType.GetProperty("NextFrameIndex")!.GetValue(transition)!;
        transitionText.Add($"{source}->{next}");
    }

    return (
        (int)resultType.GetProperty("Interpolated")!.GetValue(result)!,
        (int)resultType.GetProperty("SceneCutStops")!.GetValue(result)!,
        string.Join(",", transitionText));
}

'''.splitlines()
          lines[invoke_start:invoke_end] = [line + nl for line in new_invoke]

          nested_type = find(lines, 'var detectionType = typeof(AutoMaskGenerator).GetNestedType(')
          nested_end = find_next(lines, 'BindingFlags.NonPublic)!;', nested_type, 6)
