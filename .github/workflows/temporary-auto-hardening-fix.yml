name: Temporary Auto Hardening Fix

on:
  push:
    branches:
      - docs/manual-blur-player-architecture

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted patch
        id: apply_patch
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/temporary_apply_auto_hardening.py')
          text = path.read_text()

          old = 'catch_idx = find(lines, "catch (OperationCanceledException) when (ct.IsCancellationRequested)")'
          new = 'generate_async = find(lines, "public async Task GenerateAsync(")\ncatch_idx = find_next(lines, "catch (OperationCanceledException) when (ct.IsCancellationRequested)", generate_async, 500)'
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one GenerateAsync catch locator, found {text.count(old)}')
          text = text.replace(old, new)

          start = text.index('if any(line.strip() for line in lines[brace_idx + 1 : close_idx]):')
          end = text.index('\n\nseq_start =', start)
          replacement = '''if not any("throw;" in line for line in lines[brace_idx + 1 : close_idx]):
              indent = lines[brace_idx][: len(lines[brace_idx]) - len(lines[brace_idx].lstrip())] + "    "
              lines[brace_idx + 1 : close_idx] = [indent + "throw;" + eol(lines[brace_idx])]'''
          text = text[:start] + replacement + text[end:]

          old = 'bridge_call = find(lines, "CanBridgeSparseResults(")'
          new = 'bridge_call = find_next(lines, "CanBridgeSparseResults(", next_call, 40)'
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one CanBridge call locator, found {text.count(old)}')
          text = text.replace(old, new)

          path.write_text(text)
          PY
          python3 scripts/temporary_apply_auto_hardening.py 2>&1 | tee temporary-patch.log

      - name: Check patch shape
        run: |
          git diff --check
          git diff --stat
          git status --short

      - name: Run runtime hardening source verifier
        shell: pwsh
        run: ./scripts/verify-runtime-hardening.ps1

      - name: Run sparse materialization harness
        shell: pwsh
        run: ./scripts/verify-automask-sparse-materialize-scene-cut.ps1

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f temporary-patch.log
          git rm -f --ignore-unmatch temporary-patch-error.txt
          git rm .github/workflows/temporary-auto-hardening-fix.yml scripts/temporary_apply_auto_hardening.py
          git add Services/Analysis/AutoMaskGenerator.cs \
                  Services/Analysis/SparseTrackingMaterializer.cs \
                  Services/Video/FrameMaskProvider.cs \
                  Services/Video/VideoFrameProcessingPolicy.cs \
                  Services/Workspace/WorkspaceStateStore.cs \
                  ViewModels/Workspace/FramePreviewViewModel.cs \
                  scripts/verify-runtime-hardening.ps1 \
                  scripts/verify-automask-sparse-materialize-scene-cut.ps1 \
                  QUALITY_STABILIZATION_REVIEW_FIXES.md
          git diff --cached --check
          git commit -m "Harden Auto cancellation and stored mask reads"
          git push origin HEAD:docs/manual-blur-player-architecture

      - name: Publish patch diagnostics
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f temporary-patch.log ]; then
            cp temporary-patch.log temporary-patch-error.txt
          else
            echo "Patch step did not produce a diagnostic log." > temporary-patch-error.txt
          fi
          git add temporary-patch-error.txt
          git commit -m "chore: capture auto hardening patch failure" || true
          git push origin HEAD:docs/manual-blur-player-architecture || true
