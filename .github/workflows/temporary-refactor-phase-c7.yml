name: Temporary Refactor Phase C7

on:
  push:
    branches:
      - refactor/ownership-workspace-hardening

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply auto strategy planner extraction
        run: python3 scripts/temporary_refactor_phase_c7.py

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          git config core.whitespace cr-at-eol
          git diff --check
          grep -q 'enum AutoMaskGenerationStrategyKind' Services/Analysis/AutoMaskGenerationStrategyPlanner.cs
          grep -q 'class AutoMaskDetectorPool' Services/Analysis/AutoMaskGenerationStrategyPlanner.cs
          grep -q 'AutoMaskGenerationStrategyPlanner.Resolve' Services/Analysis/AutoMaskGenerator.cs
          grep -q 'CreateCompatibleDetectorPool' Services/Analysis/AutoMaskGenerator.cs
          if grep -q 'TryAddCompatibleParallelDetector' Services/Analysis/AutoMaskGenerator.cs; then exit 1; fi

      - name: Build Release
        run: dotnet build FaceShield.csproj -c Release -p:UseAppHost=false --nologo

      - name: Commit verified phase
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/temporary_refactor_phase_c7.py
          rm -f .github/workflows/temporary-refactor-phase-c7.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract auto mask strategy planning'
          git push origin HEAD:refactor/ownership-workspace-hardening
