name: Temporary Refactor Phase C2

on:
  push:
    branches:
      - refactor/ownership-workspace-hardening

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply issue review extraction
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/temporary_refactor_phase_c2.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('    """")', '    "")')
          p.write_text(text, encoding='utf-8')
          PY
          python3 scripts/temporary_refactor_phase_c2.py > /tmp/phase-c2.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            cat /tmp/phase-c2.log
            git reset --hard HEAD
            cp /tmp/phase-c2.log temporary-refactor-phase-c2-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add temporary-refactor-phase-c2-error.txt
            git commit -m 'chore: capture issue extraction patch failure'
            git push origin HEAD:refactor/ownership-workspace-hardening
            exit $status
          fi
          cat /tmp/phase-c2.log

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          git config core.whitespace cr-at-eol
          git diff --check
          grep -q 'class IssueReviewCoordinator' ViewModels/Workspace/IssueReviewCoordinator.cs
          grep -q '_issueReview = new IssueReviewCoordinator' ViewModels/Pages/WorkspaceViewModel.cs
          grep -q '_issueReview.BuildAsync' ViewModels/Pages/WorkspaceViewModel.cs
          grep -q '_issueReview.ResolveIssueForFrame' ViewModels/Pages/WorkspaceViewModel.cs
          grep -q '_issueReview.CancelTimeRefresh' ViewModels/Pages/WorkspaceViewModel.cs
          if grep -q '_issueTimeCts' ViewModels/Pages/WorkspaceViewModel.cs; then exit 1; fi
          if grep -q '_noFaceIssueSet' ViewModels/Pages/WorkspaceViewModel.cs; then exit 1; fi

      - name: Build Release
        run: dotnet build FaceShield.csproj -c Release -p:UseAppHost=false --nologo

      - name: Commit verified phase
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/temporary_refactor_phase_c2.py
          rm -f .github/workflows/temporary-refactor-phase-c2.yml
          rm -f temporary-refactor-phase-c2-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract workspace issue review coordination'
          git push origin HEAD:refactor/ownership-workspace-hardening
