name: Temporary Export Quality Presets

on:
  push:
    branches:
      - refactor/ownership-workspace-hardening

permissions:
  contents: write

jobs:
  patch-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Prepare FFmpeg 8 Windows bundle
        shell: pwsh
        run: |
          $bundle = "FFmpeg/win-x64-binaries.tar.gz"
          if (!(Test-Path $bundle)) { throw "FFmpeg bundle missing: $bundle" }
          New-Item -ItemType Directory -Path "FFmpeg/win-x64" -Force | Out-Null
          tar -xzf $bundle -C "FFmpeg/win-x64"
          foreach ($name in @("avcodec-62.dll", "avformat-62.dll", "avutil-60.dll", "swscale-9.dll", "swresample-6.dll")) {
            if (!(Test-Path (Join-Path "FFmpeg/win-x64" $name))) { throw "Missing native DLL: $name" }
          }

      - name: Resolve fixture ffmpeg CLI
        shell: pwsh
        run: |
          $cmd = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (!$cmd) {
            choco install ffmpeg -y --no-progress
            $cmd = Get-Command ffmpeg -ErrorAction Stop
          }
          "FFMPEG_CLI=$($cmd.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $cmd.Source -version | Select-Object -First 1

      - name: Apply export quality preset patch
        run: python scripts/temporary-export-quality-presets-patch.py

      - name: Source invariants
        shell: python
        run: |
          from pathlib import Path
          preset = Path('Services/Video/VideoExportQualityPreset.cs').read_text(encoding='utf-8')
          fidelity = Path('Services/Video/VideoExportFidelityPolicy.cs').read_text(encoding='utf-8')
          context = Path('Services/Video/VideoEncoderContextPolicy.cs').read_text(encoding='utf-8')
          service = Path('Services/Video/VideoExportService.cs').read_text(encoding='utf-8')
          coordinator = Path('ViewModels/Workspace/WorkspaceExportCoordinator.cs').read_text(encoding='utf-8')
          workspace = Path('ViewModels/Pages/WorkspaceViewModel.cs').read_text(encoding='utf-8')
          panel = Path('ViewModels/Workspace/ToolPanelViewModel.cs').read_text(encoding='utf-8')
          view = Path('Views/Workspace/ToolPanelView.axaml').read_text(encoding='utf-8')
          quality = Path('Services/Video/VideoEncoderQualityPolicy.cs').read_text(encoding='utf-8')
          checks = [
              ('VideoExportQualityPreset', preset),
              ('1.00', preset),
              ('1.20', preset),
              ('1.40', preset),
              ('VideoExportQualityPreset qualityPreset', fidelity),
              ('qualityPreset);', context),
              ('VideoExportQualityPreset.SizePriority', service),
              ('qualityPreset: qualityPreset', service),
              ('qualityPreset={qualityPreset}', coordinator),
              ('qualityPreset: ToolPanel.ExportQualityPreset', workspace),
              ('균형 (권장)', panel),
              ('SelectedExportQuality', panel),
              ('내보내기 화질/용량', view),
              ('SetOption("crf", "18", required: true);', quality),
          ]
          for marker, text in checks:
              if marker not in text:
                  raise SystemExit(f'missing invariant: {marker}')
          if 'ctx->rc_max_rate = targetBitrate;' not in context:
              raise SystemExit('known-source max-rate is no longer bounded to target bitrate')
          if not Path('scripts/verify-export-quality-presets.ps1').exists():
              raise SystemExit('permanent export quality preset verifier was not created')

      - name: Diff check
        run: git diff --check

      - name: Export preset policy regression
        shell: pwsh
        run: ./scripts/verify-export-quality-presets.ps1

      - name: Encoder quality baseline regression
        shell: pwsh
        run: ./scripts/verify-encoder-quality-options.ps1

      - name: End-to-end three-preset export verification
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "export-quality-source.mp4"
          Remove-Item $source -Force -ErrorAction SilentlyContinue
          & $env:FFMPEG_CLI -hide_banner -loglevel error -f lavfi -i "testsrc2=size=640x360:rate=30" -t 6 -c:v libx264 -preset veryfast -b:v 800k -maxrate 800k -bufsize 1600k -pix_fmt yuv420p -an -y $source
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $source)) { throw "Fixture generation failed" }
          Write-Host "[ExportQualityFixture] bytes=$((Get-Item $source).Length) path=$source"

          $work = Join-Path $env:GITHUB_WORKSPACE ".tmp-export-quality-presets-e2e"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $project = Join-Path $work "Test.csproj"
          $program = Join-Path $work "Program.cs"
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework><Nullable>enable</Nullable><RuntimeIdentifier>win-x64</RuntimeIdentifier></PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="$env:GITHUB_WORKSPACE\FaceShield.csproj" />
              <None Include="$env:GITHUB_WORKSPACE\FFmpeg\win-x64\*.dll" Link="%(Filename)%(Extension)" CopyToOutputDirectory="PreserveNewest" />
            </ItemGroup>
          </Project>
          "@ | Set-Content -Encoding UTF8 $project
          @'
          using System;
          using System.Collections.Generic;
          using System.IO;
          using Avalonia;
          using FaceShield.Services.Video;

          string source = args[0];
          string outputDir = args[1];
          FFmpegBootstrap.Initialize();
          using var liveProvider = new FrameMaskProvider();
          var size = new PixelSize(640, 360);
          for (int i = 0; i < 180; i++)
              liveProvider.SetFaceRects(i, new[] { new Rect(180 + (i % 30), 100, 120, 120) }, size, 0.90f, new[] { 0.90f });

          var cases = new[]
          {
              (Preset: VideoExportQualityPreset.SizePriority, Label: "size", ExpectedTargetRatio: 1.00, MaxFileRatio: 1.35),
              (Preset: VideoExportQualityPreset.Balanced, Label: "balanced", ExpectedTargetRatio: 1.20, MaxFileRatio: 1.55),
              (Preset: VideoExportQualityPreset.QualityPriority, Label: "quality", ExpectedTargetRatio: 1.40, MaxFileRatio: 1.80),
          };

          long sourceBytes = new FileInfo(source).Length;
          long previousTarget = 0;
          var outputs = new List<string>();
          foreach (var test in cases)
          {
              string output = Path.Combine(outputDir, $"export-quality-{test.Label}.mp4");
              File.Delete(output);
              using var snapshot = liveProvider.CreateSnapshot();
              var exporter = new VideoExportService(snapshot);
              exporter.Export(
                  source,
                  output,
                  blurRadius: 8,
                  allowHybridCopy: false,
                  qualityPreset: test.Preset);
              var summary = exporter.LastExportSummary ?? throw new Exception($"missing summary: {test.Label}");
              long outputBytes = new FileInfo(output).Length;
              double fileRatio = outputBytes / (double)sourceBytes;
              double targetRatio = summary.SourceVideoBitrate > 0
                  ? summary.TargetVideoBitrate / (double)summary.SourceVideoBitrate
                  : 0.0;
              Console.WriteLine($"[ExportQualityE2E] preset={test.Preset} sourceBytes={sourceBytes} outputBytes={outputBytes} fileRatio={fileRatio:0.000} encoder={summary.EncoderName} mode={summary.EncoderQualityMode} sourceRate={summary.SourceVideoBitrate} targetRate={summary.TargetVideoBitrate} targetRatio={targetRatio:0.000}");
              if (summary.SourceVideoBitrate <= 0 || summary.TargetVideoBitrate <= 0)
                  throw new Exception($"missing bitrate summary: {test.Label}");
              if (Math.Abs(targetRatio - test.ExpectedTargetRatio) > 0.035)
                  throw new Exception($"unexpected target ratio {test.Label}: {targetRatio:0.000}");
              if (fileRatio > test.MaxFileRatio)
                  throw new Exception($"file ratio too high {test.Label}: {fileRatio:0.000}");
              if (summary.TargetVideoBitrate <= previousTarget)
                  throw new Exception($"target bitrate did not increase for {test.Label}");
              previousTarget = summary.TargetVideoBitrate;
              outputs.Add(output);
          }

          File.WriteAllLines(Path.Combine(outputDir, "export-quality-outputs.txt"), outputs);
          '@ | Set-Content -Encoding UTF8 $program

          dotnet run --project $project -c Release -r win-x64 -p:UseAppHost=false -- $source $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "Actual three-preset export harness failed: $LASTEXITCODE" }

          foreach ($output in Get-Content (Join-Path $env:GITHUB_WORKSPACE "export-quality-outputs.txt")) {
            & $env:FFMPEG_CLI -hide_banner -loglevel error -i $output -f null -
            if ($LASTEXITCODE -ne 0) { throw "Output decode verification failed: $output" }
            Remove-Item $output -Force
          }
          Remove-Item (Join-Path $env:GITHUB_WORKSPACE "export-quality-outputs.txt") -Force
          Remove-Item $source -Force
          Remove-Item $work -Recurse -Force

      - name: Release build
        run: dotnet build FaceShield.csproj -c Release -p:UseAppHost=false --nologo

      - name: Commit verified product source
        shell: pwsh
        run: |
          Remove-Item scripts/temporary-export-quality-presets-patch.py -Force
          Remove-Item .github/workflows/temporary-export-quality-presets.yml -Force
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff check failed" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Services/Video/VideoExportQualityPreset.cs Services/Video/VideoExportFidelityPolicy.cs Services/Video/VideoEncoderContextPolicy.cs Services/Video/VideoExportService.cs ViewModels/Workspace/ToolPanelViewModel.cs ViewModels/Workspace/WorkspaceExportCoordinator.cs ViewModels/Pages/WorkspaceViewModel.cs Views/Workspace/ToolPanelView.axaml scripts/verify-export-quality-presets.ps1 scripts/temporary-export-quality-presets-patch.py .github/workflows/temporary-export-quality-presets.yml
          git commit -m "Add user-selectable export quality presets"
          if ($LASTEXITCODE -ne 0) { throw "commit failed" }
          git push origin HEAD:refactor/ownership-workspace-hardening
          if ($LASTEXITCODE -ne 0) { throw "push failed" }
