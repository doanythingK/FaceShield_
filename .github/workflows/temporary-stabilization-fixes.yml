name: Temporary Stabilization Fixes

on:
  push:
    branches: [refactor/ownership-workspace-hardening]

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply stabilization patch
        shell: pwsh
        run: |
          python -c "from pathlib import Path; p=Path('scripts/temporary-stabilization-fixes.py'); s=p.read_text(encoding='utf-8'); s=s.replace('end = text.find(end_marker, start)', 'end = text.find(adapt(end_marker, local_newline(text)), start)'); p.write_text(s, encoding='utf-8')"
          python scripts/temporary-stabilization-fixes.py

      - name: Verify source invariants
        shell: python
        run: |
          from pathlib import Path

          state = Path('Services/Workspace/WorkspaceStateStore.cs').read_text(encoding='utf-8')
          persistence = Path('Services/Workspace/WorkspacePersistenceCoordinator.cs').read_text(encoding='utf-8')
          provider = Path('Services/Video/FrameMaskProvider.cs').read_text(encoding='utf-8')
          auto = Path('ViewModels/Workspace/AutoMaskRunCoordinator.cs').read_text(encoding='utf-8')
          track = Path('Services/Analysis/FaceTrackInterpolator.cs').read_text(encoding='utf-8')
          planner = Path('Services/Analysis/AutoMaskGenerationStrategyPlanner.cs').read_text(encoding='utf-8')

          required = [
              ('GlobalStateGate', state),
              ('RefreshStateLocked();', state),
              ('SaveWorkspaceSnapshot(', state),
              ('useBorrowedStoredMasks', state),
              ('GetStoredMaskBorrowedSnapshot()', provider),
              ('FrameMaskProvider maskSnapshot = _maskProvider.CreateSnapshot();', persistence),
              ('_store.SaveWorkspaceSnapshot(snapshot, maskSnapshot)', persistence),
              ('qualityPreset: _toolPanel.ExportQualityPreset', auto),
              ('DisposeCreatedSecondaryDetectors(detectors);', planner),
          ]
          for marker, text in required:
              if marker not in text:
                  raise SystemExit(f'missing invariant: {marker}')

          start = track.index('private static int FillShortTrackGaps(')
          end = track.index('private static int FillConfirmedInitialFrames(', start)
          gap_block = track[start:end]
          if gap_block.count('IsConfirmedTrack(track, options)') != 1:
              raise SystemExit('weighted evidence confirmation is still repeated per gap')
          if 'bool confirmedTrack = IsConfirmedTrack(track, options);' not in gap_block:
              raise SystemExit('per-track confirmed cache missing')

      - name: Diff check
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "diff check failed" }

      - name: Existing face-track and export regressions
        shell: pwsh
        run: |
          ./scripts/verify-face-track-postprocess.ps1
          if ($LASTEXITCODE -ne 0) { throw "face-track regression failed" }
          ./scripts/verify-export-quality-presets.ps1
          if ($LASTEXITCODE -ne 0) { throw "export preset regression failed" }

      - name: Workspace persistence and detector rollback harness
        shell: pwsh
        run: |
          $work = Join-Path $env:GITHUB_WORKSPACE ".tmp-stabilization-harness"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <Nullable>enable</Nullable>
              <RuntimeIdentifier>win-x64</RuntimeIdentifier>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="$env:GITHUB_WORKSPACE\FaceShield.csproj" />
            </ItemGroup>
          </Project>
          "@ | Set-Content -Encoding UTF8 (Join-Path $work "Test.csproj")

          @'
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Text.Json;
          using System.Threading.Tasks;
          using Avalonia;
          using Avalonia.Media.Imaging;
          using FaceShield.Enums.Workspace;
          using FaceShield.Models.Analysis;
          using FaceShield.Services.Analysis;
          using FaceShield.Services.FaceDetection;
          using FaceShield.Services.Video;
          using FaceShield.Services.Workspace;

          static WorkspaceSnapshot Snapshot(string path, int selectedFrame) => new(
              path,
              WorkspaceMode.Auto,
              selectedFrame,
              1.25,
              12.0,
              DateTimeOffset.UtcNow,
              0,
              false,
              null,
              false,
              false,
              null,
              false,
              false,
              null);

          static void Assert(bool condition, string message)
          {
              if (!condition) throw new InvalidOperationException(message);
          }

          string root = Path.Combine(
              Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData),
              "FaceShield");
          if (Directory.Exists(root))
              Directory.Delete(root, recursive: true);

          // Process-global store serialization must preserve unrelated fields even across
          // two store instances with independently cached AppState objects.
          var storeA = new WorkspaceStateStore();
          var storeB = new WorkspaceStateStore();
          using var raceProvider = new FrameMaskProvider();
          raceProvider.SetFaceRects(
              0,
              new[] { new Rect(10, 10, 20, 20) },
              new PixelSize(320, 180),
              0.9f,
              new[] { 0.9f });
          var raceSnapshot = Snapshot("state-race-video.mp4", 3);

          Task settingsTask = Task.Run(() =>
          {
              for (int i = 0; i < 12; i++)
                  storeA.SaveAutoSettings(new AutoSettingsState { BlurRadius = 20 + i });
          });
          Task workspaceTask = Task.Run(() =>
          {
              for (int i = 0; i < 12; i++)
                  storeB.SaveWorkspace(raceSnapshot, raceProvider);
          });
          await Task.WhenAll(settingsTask, workspaceTask);

          string stateFile = Path.Combine(root, "state.json");
          using (JsonDocument doc = JsonDocument.Parse(File.ReadAllText(stateFile)))
          {
              JsonElement rootElement = doc.RootElement;
              Assert(rootElement.TryGetProperty("AutoSettings", out var settings) && settings.ValueKind == JsonValueKind.Object,
                  "AutoSettings was lost during concurrent state saves.");
              Assert(rootElement.TryGetProperty("Workspaces", out var workspaces) && workspaces.GetArrayLength() > 0,
                  "Workspace state was lost during concurrent state saves.");
          }
          Assert(!File.Exists(stateFile + ".tmp"), "state.json.tmp was left behind.");

          // Scalar snapshot and masks must represent the same QueueSaveAsync call time.
          var store = new WorkspaceStateStore();
          using var live = new FrameMaskProvider();
          live.SetFaceRects(
              9,
              new[] { new Rect(11, 12, 30, 31) },
              new PixelSize(640, 360),
              0.91f,
              new[] { 0.91f });
          using (var coordinator = new WorkspacePersistenceCoordinator(store, live))
          {
              string videoPath = "snapshot-consistency-video.mp4";
              Task queued = coordinator.QueueSaveAsync(Snapshot(videoPath, 9));
              live.SetFaceRects(
                  9,
                  new[] { new Rect(111, 112, 40, 41) },
                  new PixelSize(640, 360),
                  0.92f,
                  new[] { 0.92f });
              await queued;

              using var loaded = new FrameMaskProvider();
              Assert(store.TryLoadWorkspace(videoPath, WorkspaceMode.Auto, loaded, out var loadedSnapshot),
                  "queued workspace was not loadable");
              Assert(loadedSnapshot?.SelectedFrameIndex == 9,
                  "scalar snapshot was not the queued snapshot");
              Assert(loaded.TryGetFaceMaskData(9, out var data),
                  "queued face mask was not persisted");
              Assert(Math.Abs(data.Faces[0].X - 11.0) < 0.001,
                  $"mask snapshot drifted after queue: X={data.Faces[0].X}");
          }

          // A factory failure after one secondary detector was created must roll it back,
          // while the caller-owned primary remains alive.
          var primary = new FakeDetector();
          var factory = new ThrowingFactory();
          Type plannerType = typeof(AutoMaskOptions).Assembly.GetType(
              "FaceShield.Services.Analysis.AutoMaskGenerationStrategyPlanner",
              throwOnError: true)!;
          MethodInfo createPool = plannerType.GetMethod(
              "CreateCompatibleDetectorPool",
              BindingFlags.Static | BindingFlags.NonPublic)!;
          try
          {
              createPool.Invoke(null, new object[] { primary, factory, 3 });
              throw new InvalidOperationException("planned detector factory failure did not propagate");
          }
          catch (TargetInvocationException ex) when (ex.InnerException is InvalidOperationException)
          {
          }
          Assert(factory.Secondary != null && factory.Secondary.Disposed,
              "created secondary detector leaked after pool construction failure");
          Assert(!primary.Disposed, "caller-owned primary detector was disposed by rollback");
          primary.Dispose();

          Console.WriteLine("[StabilizationHarness] PASS state-serialization snapshot-consistency detector-rollback");

          sealed class FakeDetector : IBgraFaceDetector
          {
              public bool Disposed { get; private set; }
              public System.Collections.Generic.IReadOnlyList<FaceDetectionResult> DetectFaces(WriteableBitmap frame)
                  => Array.Empty<FaceDetectionResult>();
              public System.Collections.Generic.IReadOnlyList<FaceDetectionResult> DetectFacesDownscaled(
                  WriteableBitmap frame, double ratio, DownscaleQuality quality)
                  => Array.Empty<FaceDetectionResult>();
              public System.Collections.Generic.IReadOnlyList<FaceDetectionResult> DetectFacesBgra(
                  IntPtr data, int stride, int width, int height, double ratio, DownscaleQuality quality)
                  => Array.Empty<FaceDetectionResult>();
              public void Dispose() => Disposed = true;
          }

          sealed class ThrowingFactory : IFaceDetectorFactory
          {
              private int _calls;
              public FakeDetector? Secondary { get; private set; }
              public IFaceDetector CreateDetector()
              {
                  _calls++;
                  if (_calls == 1)
                      return Secondary = new FakeDetector();
                  throw new InvalidOperationException("planned factory failure");
              }
          }
          '@ | Set-Content -Encoding UTF8 (Join-Path $work "Program.cs")

          dotnet run --project (Join-Path $work "Test.csproj") -c Release -r win-x64 -p:UseAppHost=false
          if ($LASTEXITCODE -ne 0) { throw "stabilization harness failed" }
          Remove-Item $work -Recurse -Force

      - name: Release build
        shell: pwsh
        run: |
          dotnet build FaceShield.csproj -c Release -r win-x64 -p:UseAppHost=false --nologo
          if ($LASTEXITCODE -ne 0) { throw "Release build failed" }

      - name: Commit verified fixes
        shell: pwsh
        run: |
          Remove-Item scripts/temporary-stabilization-fixes.py -Force
          Remove-Item .github/workflows/temporary-stabilization-fixes.yml -Force
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "final diff check failed" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Services/Video/FrameMaskProvider.cs Services/Workspace/WorkspaceStateStore.cs Services/Workspace/WorkspacePersistenceCoordinator.cs ViewModels/Workspace/AutoMaskRunCoordinator.cs Services/Analysis/FaceTrackInterpolator.cs Services/Analysis/AutoMaskGenerationStrategyPlanner.cs scripts/temporary-stabilization-fixes.py .github/workflows/temporary-stabilization-fixes.yml
          git commit -m "Harden workspace persistence and auto export"
          if ($LASTEXITCODE -ne 0) { throw "commit failed" }
          git push origin HEAD:refactor/ownership-workspace-hardening
          if ($LASTEXITCODE -ne 0) { throw "push failed" }
