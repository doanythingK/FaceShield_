name: Refactor AutoMask Pipe Parallel

on:
  push:
    branches:
      - refactor/ownership-workspace-hardening

permissions:
  contents: write

jobs:
  refactor-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract pipe-parallel strategy body
        shell: python
        run: |
          from pathlib import Path
          import codecs

          source_path = Path('Services/Analysis/AutoMaskGenerator.cs')
          target_path = Path('Services/Analysis/AutoMaskGenerator.PipelinedParallel.cs')

          raw = source_path.read_bytes()
          has_bom = raw.startswith(codecs.BOM_UTF8)
          text = raw[len(codecs.BOM_UTF8):].decode('utf-8') if has_bom else raw.decode('utf-8')

          method_marker = '        private void GeneratePipelinedDetectAllParallel('
          next_marker = '        private void GenerateSparsePipelinedTrackingParallel('

          if text.count(method_marker) != 1:
              raise SystemExit(f'expected one pipe-parallel method, found {text.count(method_marker)}')
          if text.count(next_marker) != 1:
              raise SystemExit(f'expected one sparse marker, found {text.count(next_marker)}')
          if target_path.exists():
              raise SystemExit(f'{target_path} already exists')

          start = text.index(method_marker)
          end = text.index(next_marker, start)
          method_text = text[start:end].rstrip('\r\n')
          main_text = text[:start] + text[end:]

          target_text = '''using Avalonia;
          using FaceShield.Services.FaceDetection;
          using System;
          using System.Collections.Generic;
          using System.Diagnostics;
          using System.Threading;
          using System.Threading.Tasks;

          namespace FaceShield.Services.Analysis
          {
              public sealed partial class AutoMaskGenerator
              {
          ''' + method_text + '''
              }
          }
          '''

          output = main_text.encode('utf-8')
          if has_bom:
              output = codecs.BOM_UTF8 + output
          source_path.write_bytes(output)
          target_path.write_text(target_text, encoding='utf-8', newline='\n')

      - name: Source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "public sealed partial class AutoMaskGenerator" Services/Analysis/AutoMaskGenerator.PipelinedParallel.cs
          grep -q "GeneratePipelinedDetectAllParallel(" Services/Analysis/AutoMaskGenerator.cs
          test "$(grep -R --include='AutoMaskGenerator*.cs' -F 'private void GeneratePipelinedDetectAllParallel(' Services/Analysis | wc -l)" -eq 1
          ! grep -q -F 'private void GeneratePipelinedDetectAllParallel(' Services/Analysis/AutoMaskGenerator.cs
          test "$(grep -R --include='AutoMaskGenerator*.cs' -F 'private void GenerateSequential(' Services/Analysis | wc -l)" -eq 1
          test "$(grep -R --include='AutoMaskGenerator*.cs' -F 'private void GeneratePipelinedDetectAll(' Services/Analysis | wc -l)" -eq 1
          test "$(grep -R --include='AutoMaskGenerator*.cs' -F 'private void GenerateSparsePipelinedTrackingParallel(' Services/Analysis | wc -l)" -eq 1
          ! grep -R -E 'public[[:space:]].*TryGetStoredMaskBorrowed' Services
          git diff --check

      - name: Release build
        run: dotnet build FaceShield.csproj -c Release -p:UseAppHost=false --nologo

      - name: Commit verified refactor
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refactor-automask-pipe-parallel.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Services/Analysis/AutoMaskGenerator.cs Services/Analysis/AutoMaskGenerator.PipelinedParallel.cs .github/workflows/refactor-automask-pipe-parallel.yml
          git commit -m "Extract pipe-parallel auto mask strategy body"
          git push origin HEAD:refactor/ownership-workspace-hardening
