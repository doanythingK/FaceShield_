# One-shot verifier; removes itself after build and overlap regression pass.
name: One-shot manual editor layer overlap fix

on:
  push:
    branches:
      - refactor/manual-overlay-workflow
    paths:
      - .github/workflows/apply-manual-editor-layer-once.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.ref == 'refs/heads/refactor/manual-overlay-workflow'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply guarded editor integration patch
        run: python3 scripts/apply-manual-editor-layer-once.py
      - name: Build application
        run: |
          dotnet restore FaceShield.csproj -r osx-arm64
          dotnet build FaceShield.csproj -c Release -r osx-arm64 --no-restore -p:ContinuousIntegrationBuild=true
      - name: Verify manual overlay and Auto overlap regression
        run: bash scripts/verify-manual-overlay.sh
      - name: Verify patch whitespace
        run: git diff --check
      - name: Commit validated editor and remove staging workflow
        run: |
          git rm -- .github/workflows/apply-manual-editor-layer-once.yml scripts/apply-manual-editor-layer-once.py
          git add -- ViewModels/Workspace/FramePreviewViewModel.cs ViewModels/Workspace/FramePreviewViewModel.ManualKeyframes.cs scripts/frame-mask-layer-regression.cs.txt
          git -c user.name='FaceShield CI' -c user.email='actions@users.noreply.github.com' commit -m 'fix: edit manual alpha independently of overlapping Auto masks'
          git push origin HEAD:refactor/manual-overlay-workflow
