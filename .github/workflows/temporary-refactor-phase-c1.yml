name: Temporary Refactor Phase C1

on:
  push:
    branches:
      - refactor/ownership-workspace-hardening

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply state mapper extraction
        run: python3 scripts/temporary_refactor_phase_c1.py

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          git config core.whitespace cr-at-eol
          git diff --check
          grep -q 'class WorkspaceStateMapper' Services/Workspace/WorkspaceStateMapper.cs
          grep -q 'WorkspaceStateMapper.CreateSnapshot' ViewModels/Pages/WorkspaceViewModel.cs
          grep -q 'WorkspaceStateMapper.CreateRestoreState' ViewModels/Pages/WorkspaceViewModel.cs
          grep -q 'WorkspaceStateMapper.ClampViewStart' ViewModels/Pages/WorkspaceViewModel.cs

      - name: Build Release
        run: dotnet build FaceShield.csproj -c Release -p:UseAppHost=false --nologo

      - name: Commit verified phase
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/temporary_refactor_phase_c1.py
          rm -f .github/workflows/temporary-refactor-phase-c1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract workspace state mapping'
          git push origin HEAD:refactor/ownership-workspace-hardening
