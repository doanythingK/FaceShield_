name: Hardening Quality Gate

on:
  push:
    branches:
      - "main"
      - "hardening/**"
      - "refactor/manual-mask-keyframes"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify runtime hardening invariants
        shell: pwsh
        run: ./scripts/verify-runtime-hardening.ps1

      - name: Restore
        run: dotnet restore FaceShield.csproj -r win-x64

      - name: Build
        run: dotnet build FaceShield.csproj -c Release -r win-x64 --no-restore -p:ContinuousIntegrationBuild=true

  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FaceShield.csproj -r osx-arm64

      - name: Build
        run: dotnet build FaceShield.csproj -c Release -r osx-arm64 --no-restore -p:ContinuousIntegrationBuild=true

      - name: Verify manual pyramid reuse and allocations
        run: bash scripts/verify-manual-pyramid.sh

      - name: Verify decoded manual tracking integration (synthetic video)
        if: github.ref == 'refs/heads/refactor/manual-mask-keyframes'
        run: bash scripts/verify-manual-tracking-integration.sh
