name: Hardening Quality Gate

on:
  push:
    branches:
      - "main"
      - "hardening/**"
      - "refactor/manual-mask-keyframes"
      - "refactor/manual-overlay-workflow"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

# Only the latest push on a development branch needs to finish. Never cancel
# a main-branch run; PR runs have their own group and remain independently visible.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify runtime hardening invariants
        shell: pwsh
        run: ./scripts/verify-runtime-hardening.ps1

      - name: Restore
        run: dotnet restore FaceShield.csproj -r win-x64

      - name: Build
        run: dotnet build FaceShield.csproj -c Release -r win-x64 --no-restore -p:ContinuousIntegrationBuild=true

  build-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FaceShield.csproj -r osx-arm64

      - name: Build
        run: dotnet build FaceShield.csproj -c Release -r osx-arm64 --no-restore -p:ContinuousIntegrationBuild=true

      - name: Verify independent manual overlay core and persistence
        run: bash scripts/verify-manual-overlay.sh

      - name: Verify manual pyramid reuse and allocations
        run: bash scripts/verify-manual-pyramid.sh

      # The production FFmpeg fixture checks overlapped manual pixels are
      # preserved, Auto-only pixels are excluded from the continuation source,
      # and both layers survive source-keyframe promotion and preview/export.
      - name: Verify continuous tracking and overlapping Auto/manual integration
        if: github.ref == 'refs/heads/refactor/manual-mask-keyframes' || github.ref == 'refs/heads/refactor/manual-overlay-workflow'
        run: bash scripts/verify-manual-tracking-integration.sh
