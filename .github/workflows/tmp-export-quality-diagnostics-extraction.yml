name: Temporary Export Quality Diagnostics Extraction

on:
  push:
    branches:
      - refactor/ownership-workspace-hardening
    paths:
      - scripts/tmp-extract-export-quality-diagnostics.py
      - .github/workflows/tmp-export-quality-diagnostics-extraction.yml

permissions:
  contents: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply extraction
        run: python scripts/tmp-extract-export-quality-diagnostics.py
      - name: Verify focused diff
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only)
          $expected = @(
            'OWNERSHIP_WORKSPACE_HARDENING_STATUS.md',
            'Services/Diagnostics/RunMetricsLog.cs',
            'ViewModels/Pages/WorkspaceViewModel.cs',
            'ViewModels/Workspace/WorkspaceExportCoordinator.cs'
          )
          $unexpected = @($changed | Where-Object { $_ -notin $expected })
          $missing = @($expected | Where-Object { $_ -notin $changed })
          if ($unexpected.Count -gt 0) { throw "Unexpected changed paths: $unexpected" }
          if ($missing.Count -gt 0) { throw "Expected changed paths missing: $missing" }
      - name: Restore
        run: dotnet restore FaceShield.sln
      - name: Release build
        run: dotnet build FaceShield.sln -c Release --no-restore

  commit_fix:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ownership-workspace-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified extraction
        run: python scripts/tmp-extract-export-quality-diagnostics.py
      - name: Remove temporary verification files
        run: |
          rm scripts/tmp-extract-export-quality-diagnostics.py
          rm .github/workflows/tmp-export-quality-diagnostics-extraction.yml
      - name: Verify final tree diff
        run: |
          git diff --check
          test ! -e scripts/tmp-extract-export-quality-diagnostics.py
          test ! -e .github/workflows/tmp-export-quality-diagnostics-extraction.yml
          git status --short
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: move export quality diagnostics out of workspace viewmodel"
          git push origin HEAD:refactor/ownership-workspace-hardening
