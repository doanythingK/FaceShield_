name: Temporary Auto Privacy Stability V5

on:
  push:
    branches:
      - refactor/ownership-workspace-hardening

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Patch scoped auto privacy continuity
        shell: python
        run: |
          from pathlib import Path

          p = Path('Services/Analysis/AutoMaskTemporalPostProcessor.cs')
          text = p.read_text(encoding='utf-8-sig').replace('\r\n', '\n')
          start = text.index('            if (continuityOnly)')
          end = text.index('            if (profile == FaceFilterProfile.Yolo)', start)
          block = text[start:end]
          changes = [
              ('                return new FaceTrackPostProcessOptions\n', '                bool cleanupYoloFalsePositives = profile == FaceFilterProfile.Yolo;\n                return new FaceTrackPostProcessOptions\n'),
              ('                    MaxLostFillFrames = 3,', '                    MaxLostFillFrames = cleanupYoloFalsePositives ? 8 : 3,'),
              ('                    AllowSmallTrackLostFill = false,', '                    AllowSmallTrackLostFill = cleanupYoloFalsePositives,'),
              ('                    DropShortTrackMaxDetections = 0,', '                    DropShortTrackMaxDetections = cleanupYoloFalsePositives ? 2 : 0,'),
              ('                    DropShortSmallTrackMaxDetections = 0,', '                    DropShortSmallTrackMaxDetections = cleanupYoloFalsePositives ? 3 : 0,'),
              ('                    ShortTrackMaxConfidence = 0f,', '                    ShortTrackMaxConfidence = cleanupYoloFalsePositives ? 0.48f : 0f,'),
              ('                    DropSparseTrackMaxDetections = 0,', '                    DropSparseTrackMaxDetections = cleanupYoloFalsePositives ? 3 : 0,'),
              ('                    DropSparseTrackMaxDensity = 0f,', '                    DropSparseTrackMaxDensity = cleanupYoloFalsePositives ? 0.42 : 0.0,'),
              ('                    SparseTrackMaxConfidence = 0f,', '                    SparseTrackMaxConfidence = cleanupYoloFalsePositives ? 0.56f : 0f,'),
              ('                    EdgeLostFillMaxConfidence = 0.60f,', '                    EdgeLostFillMaxConfidence = cleanupYoloFalsePositives ? 0f : 0.60f,'),
              ('                    MaxCenterShiftRatio = 0.55,', '                    MaxCenterShiftRatio = cleanupYoloFalsePositives ? 0.72 : 0.55,'),
              ('                    MaxConfirmedTrackBridgeCenterShiftRatio = 0.90,', '                    MaxConfirmedTrackBridgeCenterShiftRatio = cleanupYoloFalsePositives ? 1.20 : 0.90,')
          ]
          for old, new in changes:
              if block.count(old) != 1:
                  raise SystemExit(f'continuity marker mismatch {old!r}: {block.count(old)}')
              block = block.replace(old, new, 1)
          text = text[:start] + block + text[end:]

          if text.count('                    MaxLostFillFrames = 0,') != 1:
              raise SystemExit('full YOLO lost-fill marker mismatch')
          text = text.replace('                    MaxLostFillFrames = 0,', '                    MaxLostFillFrames = YoloConfirmedTrackHoldFrames,', 1)
          if text.count('                    EdgeLostFillMaxConfidence = 0.60f,') != 1:
              raise SystemExit('full YOLO edge lost-fill marker mismatch')
          text = text.replace('                    EdgeLostFillMaxConfidence = 0.60f,', '                    EdgeLostFillMaxConfidence = 0f,', 1)
          p.write_text(text, encoding='utf-8', newline='\n')

          p = Path('Services/Analysis/FaceTrackInterpolator.cs')
          text = p.read_text(encoding='utf-8-sig').replace('\r\n', '\n')
          old = '''                bool removeShortWeak = track.DetectionCount <= options.DropShortTrackMaxDetections &&\n                    track.MaxConfidence < options.ShortTrackMaxConfidence;\n                bool removeShortSmall = track.DetectionCount <= options.DropShortSmallTrackMaxDetections &&\n                    IsSmallTrack(track, options) &&\n                    !CouldBePartialFace(track, tracks, options);'''
          new = '''                bool couldBePartialFace = CouldBePartialFace(track, tracks, options);\n                bool removeShortWeak = track.DetectionCount <= options.DropShortTrackMaxDetections &&\n                    track.MaxConfidence < options.ShortTrackMaxConfidence &&\n                    !couldBePartialFace;\n                bool removeShortSmall = track.DetectionCount <= options.DropShortSmallTrackMaxDetections &&\n                    IsSmallTrack(track, options) &&\n                    !couldBePartialFace;'''
          if text.count(old) != 1:
              raise SystemExit('short cleanup block mismatch')
          text = text.replace(old, new, 1)

          lost_start = text.index('        private static int FillConfirmedLostFrames(')
          lost_end = text.index('        private static bool CrossesSceneCut(', lost_start)
          lost = text[lost_start:lost_end]
          old = '                    if (!IsMostlyInside(predicted, last.Size))\n                        break;'
          if lost.count(old) != 1:
              raise SystemExit('lost-fill visibility guard mismatch')
          lost = lost.replace(old, '                    if (!IntersectsFrame(predicted, last.Size))\n                        break;', 1)
          text = text[:lost_start] + lost + text[lost_end:]

          marker = '        private static bool IsMostlyInside(Rect rect, PixelSize size)\n'
          if text.count(marker) != 1:
              raise SystemExit('IsMostlyInside marker mismatch')
          helper = '''        private static bool IntersectsFrame(Rect rect, PixelSize size)\n        {\n            if (size.Width <= 0 || size.Height <= 0 || rect.Width <= 0 || rect.Height <= 0)\n                return false;\n\n            return rect.Right > 0 && rect.Bottom > 0 &&\n                rect.X < size.Width && rect.Y < size.Height;\n        }\n\n'''
          text = text.replace(marker, helper + marker, 1)
          p.write_text(text, encoding='utf-8', newline='\n')

          p = Path('scripts/verify-yolo-profile-state.ps1')
          text = p.read_text(encoding='utf-8-sig').replace('\r\n', '\n')
          lines = text.splitlines()
          matches = [i for i, line in enumerate(lines) if 'workspace yolo track profile exists' in line]
          if len(matches) != 1:
              raise SystemExit(f'yolo profile assertion line mismatch: {matches}')
          i = matches[0]
          line = lines[i]
          if 'MaxLostFillFrames\\s*=\\s*0' not in line or 'EdgeLostFillMaxConfidence\\s*=\\s*0\\.60f' not in line:
              raise SystemExit('old yolo track profile expectations not found')
          line = line.replace('MaxLostFillFrames\\s*=\\s*0', 'MaxLostFillFrames\\s*=\\s*YoloConfirmedTrackHoldFrames')
          line = line.replace('EdgeLostFillMaxConfidence\\s*=\\s*0\\.60f', 'EdgeLostFillMaxConfidence\\s*=\\s*0f')
          lines[i] = line
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')

      - name: Source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MaxLostFillFrames = cleanupYoloFalsePositives ? 8 : 3' Services/Analysis/AutoMaskTemporalPostProcessor.cs
          grep -q 'AllowSmallTrackLostFill = cleanupYoloFalsePositives' Services/Analysis/AutoMaskTemporalPostProcessor.cs
          grep -q 'EdgeLostFillMaxConfidence = cleanupYoloFalsePositives ? 0f : 0.60f' Services/Analysis/AutoMaskTemporalPostProcessor.cs
          grep -q 'MaxLostFillFrames = YoloConfirmedTrackHoldFrames' Services/Analysis/AutoMaskTemporalPostProcessor.cs
          grep -q 'EdgeLostFillMaxConfidence = 0f' Services/Analysis/AutoMaskTemporalPostProcessor.cs
          grep -q 'cleanupYoloFalsePositives ? 2 : 0' Services/Analysis/AutoMaskTemporalPostProcessor.cs
          grep -q 'bool couldBePartialFace = CouldBePartialFace' Services/Analysis/FaceTrackInterpolator.cs
          grep -q 'if (!IntersectsFrame(predicted, last.Size))' Services/Analysis/FaceTrackInterpolator.cs
          grep -q 'if (!IsMostlyInside(predicted, first.Size))' Services/Analysis/FaceTrackInterpolator.cs
          grep -q 'CrossesSceneCut(lastFrame, frameIndex, blockedSceneCutStarts)' Services/Analysis/FaceTrackInterpolator.cs
          grep -q 'if (hasStoredMask\[frameIndex\])' Services/Analysis/FaceTrackInterpolator.cs
          grep -Fq 'MaxLostFillFrames\\s*=\\s*YoloConfirmedTrackHoldFrames' scripts/verify-yolo-profile-state.ps1
          grep -Fq 'EdgeLostFillMaxConfidence\\s*=\\s*0f' scripts/verify-yolo-profile-state.ps1
          grep -q 'CreateSparseFaceMaskWorkingCopy' Services/Analysis/AutoMaskGenerator.SparseParallel.cs
          ! grep -q 'CreateSnapshot(' Services/Analysis/AutoMaskGenerator.SparseParallel.cs
          git diff --check

      - name: Privacy behavior harness
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/privacy-harness"
          mkdir -p "$work"
          cat > "$work/Test.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework><Nullable>enable</Nullable></PropertyGroup><ItemGroup><ProjectReference Include="$GITHUB_WORKSPACE/FaceShield.csproj" /></ItemGroup></Project>
          EOF
          cat > "$work/Program.cs" <<'EOF'
          using System;
          using Avalonia;
          using FaceShield.Services.Analysis;
          using FaceShield.Services.Video;

          var size = new PixelSize(640, 360);
          var yolo = AutoMaskTemporalPostProcessor.BuildTrackPostProcessOptions(FaceFilterProfile.Yolo, continuityOnly: true);
          if (yolo.MaxLostFillFrames != 8 || yolo.EdgeLostFillMaxConfidence != 0 || yolo.DropShortTrackMaxDetections != 2)
              throw new Exception("YOLO tracked policy mismatch");
          var faceOnnx = AutoMaskTemporalPostProcessor.BuildTrackPostProcessOptions(FaceFilterProfile.FaceOnnx, continuityOnly: true);
          if (faceOnnx.MaxLostFillFrames != 3 || faceOnnx.EdgeLostFillMaxConfidence != 0.60f || faceOnnx.DropShortTrackMaxDetections != 0)
              throw new Exception("FaceONNX tracked policy unexpectedly changed");

          var exit = new FrameMaskProvider();
          exit.SetFaceRects(10, new[] { new Rect(460,120,100,100) }, size, .74f, new[] { .74f });
          exit.SetFaceRects(11, new[] { new Rect(500,120,100,100) }, size, .62f, new[] { .62f });
          exit.SetFaceRects(12, new[] { new Rect(540,120,100,100) }, size, .45f, new[] { .45f });
          new FaceTrackInterpolator().Apply(exit, 24, yolo);
          foreach (var frame in new[] { 13, 14 })
              if (!exit.TryGetFaceMaskData(frame, out var d) || d.Faces.Count != 1)
                  throw new Exception($"partial exit exposure at frame {frame}");
          if (exit.TryGetFaceMaskData(15, out var outside) && outside.Faces.Count > 0)
              throw new Exception("tail fill continued after predicted face fully exited");

          var fp = new FrameMaskProvider();
          fp.SetFaceRects(5, new[] { new Rect(260,150,70,70) }, size, .42f, new[] { .42f });
          fp.SetFaceRects(6, new[] { new Rect(263,151,70,70) }, size, .43f, new[] { .43f });
          new FaceTrackInterpolator().Apply(fp, 12, yolo);
          if ((fp.TryGetFaceMaskData(5, out var a) && a.Faces.Count > 0) ||
              (fp.TryGetFaceMaskData(6, out var b) && b.Faces.Count > 0))
              throw new Exception("weak central false-positive track remained");

          var edge = new FrameMaskProvider();
          edge.SetFaceRects(5, new[] { new Rect(0,150,70,70) }, size, .42f, new[] { .42f });
          edge.SetFaceRects(6, new[] { new Rect(3,151,70,70) }, size, .43f, new[] { .43f });
          new FaceTrackInterpolator().Apply(edge, 12, yolo);
          if (!edge.TryGetFaceMaskData(5, out var e1) || e1.Faces.Count != 1 ||
              !edge.TryGetFaceMaskData(6, out var e2) || e2.Faces.Count != 1)
              throw new Exception("privacy-sensitive edge partial face was removed");

          Console.WriteLine("[AutoPrivacyHarness] PASS");
          EOF
          dotnet run --project "$work/Test.csproj" -c Release -p:UseAppHost=false --nologo

      - name: Existing face-track verification
        shell: pwsh
        run: ./scripts/verify-face-track-postprocess.ps1

      - name: Release build
        run: dotnet build FaceShield.csproj -c Release -p:UseAppHost=false --nologo

      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-auto-privacy-stability-v5.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Services/Analysis/AutoMaskTemporalPostProcessor.cs Services/Analysis/FaceTrackInterpolator.cs scripts/verify-yolo-profile-state.ps1 .github/workflows/temporary-auto-privacy-stability-v5.yml
          git commit -m "Harden YOLO auto blur privacy continuity"
          git push origin HEAD:refactor/ownership-workspace-hardening
