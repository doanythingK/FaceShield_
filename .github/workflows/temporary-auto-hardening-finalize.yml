name: Temporary Auto Hardening Finalize

on:
  push:
    branches:
      - docs/manual-blur-player-architecture

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize confirmed source hardening
        run: bash scripts/temporary_finalize_auto_hardening.sh
