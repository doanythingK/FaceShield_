name: Temporary Export Rate Guardrail

on:
  push:
    branches:
      - refactor/ownership-workspace-hardening

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Patch export bitrate guardrails
        shell: python
        run: |
          from pathlib import Path

          # Known source bitrate must remain source-relative instead of being forced to >=2 Mbps.
          p = Path('Services/Video/VideoExportFidelityPolicy.cs')
          text = p.read_text(encoding='utf-8-sig').replace('\r\n', '\n')
          old = '''        int boundedSourceBitrate = ClampBitrate(sourceBitrate);\n        if (boundedSourceBitrate > 0)\n        {\n            int sourceRelativeGuardrail = ClampBitrate(\n                Math.Min(\n                    (long)resolutionFloor,\n                    (long)boundedSourceBitrate * 5L / 4L));\n            int targetBitrate = Math.Max(\n                boundedSourceBitrate,\n                sourceRelativeGuardrail);\n            return Math.Max(targetBitrate, 2_000_000);\n        }\n\n        return Math.Max(resolutionFloor, 2_000_000);'''
          new = '''        int boundedSourceBitrate = ClampBitrate(sourceBitrate);\n        if (boundedSourceBitrate > 0)\n            return ResolveKnownSourceTargetBitrate(boundedSourceBitrate, resolutionFloor);\n\n        return Math.Max(resolutionFloor, 2_000_000);'''
          if text.count(old) != 1:
              raise SystemExit(f'high-quality bitrate block mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)

          marker = '''    internal static int ClampBitrate(long value)\n    {'''
          helper = '''    internal static int ResolveKnownSourceTargetBitrate(\n        long sourceBitrate,\n        int resolutionFloor)\n    {\n        int boundedSourceBitrate = ClampBitrate(sourceBitrate);\n        if (boundedSourceBitrate <= 0)\n            return 0;\n\n        int sourceRelativeGuardrail = ClampBitrate(\n            Math.Min(\n                Math.Max(0L, resolutionFloor),\n                (long)boundedSourceBitrate * 5L / 4L));\n        return Math.Max(boundedSourceBitrate, sourceRelativeGuardrail);\n    }\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('ClampBitrate marker mismatch')
          text = text.replace(marker, helper + marker, 1)

          old = '''    internal static long ResolveSourceVideoBitrate(\n        AVStream* stream,\n        AVCodecContext* decoder)\n    {\n        if (stream != null && stream->codecpar != null && stream->codecpar->bit_rate > 0)\n            return stream->codecpar->bit_rate;\n        if (decoder != null && decoder->bit_rate > 0)\n            return decoder->bit_rate;\n        return 0;\n    }'''
          new = '''    internal static long ResolveSourceVideoBitrate(\n        AVStream* stream,\n        AVCodecContext* decoder,\n        long containerBitrateFallback = 0)\n    {\n        if (stream != null && stream->codecpar != null && stream->codecpar->bit_rate > 0)\n            return stream->codecpar->bit_rate;\n        if (decoder != null && decoder->bit_rate > 0)\n            return decoder->bit_rate;\n        return containerBitrateFallback > 0\n            ? containerBitrateFallback\n            : 0;\n    }'''
          if text.count(old) != 1:
              raise SystemExit(f'source bitrate resolver mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8', newline='\n')

          # Bound CRF software encoders only when we know a source-relative bitrate.
          p = Path('Services/Video/VideoEncoderSelectionPolicy.cs')
          text = p.read_text(encoding='utf-8-sig').replace('\r\n', '\n')
          marker = '''    internal static bool RequiresSoftwareEncoderForChromaLocation(\n        AVChromaLocation chromaLocation)'''
          helper = '''    internal static bool ShouldApplySoftwareRateGuardrail(\n        string encoderName,\n        long sourceBitrate)\n    {\n        if (sourceBitrate <= 0 || string.IsNullOrWhiteSpace(encoderName))\n            return false;\n        if (string.Equals(encoderName, "libx264rgb", StringComparison.OrdinalIgnoreCase))\n            return false;\n\n        return UsesSoftwareConstantQuality(encoderName);\n    }\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('software guardrail insertion marker mismatch')
          text = text.replace(marker, helper + marker, 1)
          p.write_text(text, encoding='utf-8', newline='\n')

          # Thread the input-container bitrate into encoder setup as a scalar fallback;
          # no native resource ownership changes are involved.
          p = Path('Services/Video/VideoEncoderContextPolicy.cs')
          text = p.read_text(encoding='utf-8-sig').replace('\r\n', '\n')
          old_sig = '''        AVCodecID codecId,\n        AVStream* inStream,\n        AVCodecContext* dec,\n        AVFormatContext* outFmt,'''
          new_sig = '''        AVCodecID codecId,\n        AVStream* inStream,\n        AVCodecContext* dec,\n        long sourceContainerBitrate,\n        AVFormatContext* outFmt,'''
          if text.count(old_sig) != 1:
              raise SystemExit(f'TryCreate signature mismatch: {text.count(old_sig)}')
          text = text.replace(old_sig, new_sig, 1)

          old_open_sig = '''        AVCodec* encoder,\n        AVStream* inStream,\n        AVCodecContext* dec,\n        AVFormatContext* outFmt,'''
          new_open_sig = '''        AVCodec* encoder,\n        AVStream* inStream,\n        AVCodecContext* dec,\n        long sourceContainerBitrate,\n        AVFormatContext* outFmt,'''
          if text.count(old_open_sig) != 1:
              raise SystemExit(f'TryOpen signature mismatch: {text.count(old_open_sig)}')
          text = text.replace(old_open_sig, new_open_sig, 1)

          # Two TryOpen call sites: candidate and fallback.
          old_call = '''                candidate,\n                inStream,\n                dec,\n                outFmt,'''
          new_call = '''                candidate,\n                inStream,\n                dec,\n                sourceContainerBitrate,\n                outFmt,'''
          if text.count(old_call) != 1:
              raise SystemExit('candidate TryOpen call mismatch')
          text = text.replace(old_call, new_call, 1)
          old_call = '''                fallback,\n                inStream,\n                dec,\n                outFmt,'''
          new_call = '''                fallback,\n                inStream,\n                dec,\n                sourceContainerBitrate,\n                outFmt,'''
          if text.count(old_call) != 1:
              raise SystemExit('fallback TryOpen call mismatch')
          text = text.replace(old_call, new_call, 1)

          old_source = '''        long sourceBitrate =\n            VideoExportFidelityPolicy.ResolveSourceVideoBitrate(\n                inStream,\n                dec);'''
          new_source = '''        long sourceBitrate =\n            VideoExportFidelityPolicy.ResolveSourceVideoBitrate(\n                inStream,\n                dec,\n                sourceContainerBitrate);'''
          if text.count(old_source) != 1:
              raise SystemExit('source bitrate call mismatch')
          text = text.replace(old_source, new_source, 1)

          old_rate = '''        bool usesSoftwareConstantQuality =\n            VideoEncoderSelectionPolicy.UsesSoftwareConstantQuality(\n                encoderName);\n        if (usesSoftwareConstantQuality)\n        {\n            ctx->bit_rate = 0;\n            ctx->rc_max_rate = 0;\n            ctx->rc_buffer_size = 0;\n        }\n        else\n        {\n            ctx->bit_rate = targetBitrate;\n            ctx->rc_max_rate =\n                VideoExportFidelityPolicy.ClampBitrate(\n                    (long)targetBitrate * 2L);\n            ctx->rc_buffer_size =\n                VideoExportFidelityPolicy.ClampBitrate(\n                    (long)targetBitrate * 4L);\n        }'''
          new_rate = '''        bool usesSoftwareConstantQuality =\n            VideoEncoderSelectionPolicy.UsesSoftwareConstantQuality(\n                encoderName);\n        bool applySoftwareRateGuardrail =\n            VideoEncoderSelectionPolicy.ShouldApplySoftwareRateGuardrail(\n                encoderName,\n                sourceBitrate);\n        if (usesSoftwareConstantQuality)\n        {\n            if (applySoftwareRateGuardrail)\n            {\n                // Keep CRF quality selection, but cap sustained rate to the\n                // source-relative target so re-encoding cannot grow without bound.\n                ctx->bit_rate = targetBitrate;\n                ctx->rc_max_rate = targetBitrate;\n                ctx->rc_buffer_size =\n                    VideoExportFidelityPolicy.ClampBitrate(\n                        (long)targetBitrate * 2L);\n            }\n            else\n            {\n                // Unknown source rate and RGB H.264 retain the existing quality path.\n                ctx->bit_rate = 0;\n                ctx->rc_max_rate = 0;\n                ctx->rc_buffer_size = 0;\n            }\n        }\n        else\n        {\n            ctx->bit_rate = targetBitrate;\n            ctx->rc_max_rate =\n                VideoExportFidelityPolicy.ClampBitrate(\n                    (long)targetBitrate * 2L);\n            ctx->rc_buffer_size =\n                VideoExportFidelityPolicy.ClampBitrate(\n                    (long)targetBitrate * 4L);\n        }'''
          if text.count(old_rate) != 1:
              raise SystemExit('encoder rate-control block mismatch')
          text = text.replace(old_rate, new_rate, 1)
          p.write_text(text, encoding='utf-8', newline='\n')

          # Pass the already-open input format's scalar bitrate fallback at both encoder init sites.
          p = Path('Services/Video/VideoExportService.cs')
          text = p.read_text(encoding='utf-8-sig').replace('\r\n', '\n')
          old = '''                encoderInputCodecId,\n                inStream,\n                dec,\n                outFmt,'''
          new = '''                encoderInputCodecId,\n                inStream,\n                dec,\n                inFmt->bit_rate,\n                outFmt,'''
          if text.count(old) != 1:
              raise SystemExit('primary encoder init call mismatch')
          text = text.replace(old, new, 1)
          old = '''                    fallbackCodecId,\n                    inStream,\n                    dec,\n                    outFmt,'''
          new = '''                    fallbackCodecId,\n                    inStream,\n                    dec,\n                    inFmt->bit_rate,\n                    outFmt,'''
          if text.count(old) != 1:
              raise SystemExit('fallback encoder init call mismatch')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8', newline='\n')

      - name: Source invariants
        shell: python
        run: |
          from pathlib import Path
          fidelity = Path('Services/Video/VideoExportFidelityPolicy.cs').read_text(encoding='utf-8')
          context = Path('Services/Video/VideoEncoderContextPolicy.cs').read_text(encoding='utf-8')
          select = Path('Services/Video/VideoEncoderSelectionPolicy.cs').read_text(encoding='utf-8')
          service = Path('Services/Video/VideoExportService.cs').read_text(encoding='utf-8')
          if 'return Math.Max(targetBitrate, 2_000_000);' in fidelity:
              raise SystemExit('known-source 2 Mbps floor still present')
          for marker in [
              'ResolveKnownSourceTargetBitrate',
              'containerBitrateFallback > 0',
              'Math.Max(0L, resolutionFloor)'
          ]:
              if marker not in fidelity:
                  raise SystemExit(f'missing fidelity marker: {marker}')
          for marker in [
              'ShouldApplySoftwareRateGuardrail',
              'libx264rgb'
          ]:
              if marker not in select:
                  raise SystemExit(f'missing selection marker: {marker}')
          for marker in [
              'sourceContainerBitrate',
              'ctx->rc_max_rate = targetBitrate;',
              'ctx->rc_buffer_size =',
              'Unknown source rate and RGB H.264 retain the existing quality path.'
          ]:
              if marker not in context:
                  raise SystemExit(f'missing context marker: {marker}')
          if service.count('inFmt->bit_rate,') < 2:
              raise SystemExit('container bitrate fallback not passed to both encoder init sites')
          # Native-pointer ownership/resource frees are intentionally untouched.
          if 'avcodec_free_context(&ctx)' not in context:
              raise SystemExit('encoder context cleanup invariant missing')

      - name: Diff check
        run: git diff --check

      - name: Rate policy harness
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/export-rate-policy"
          mkdir -p "$work"
          cat > "$work/Test.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework><Nullable>enable</Nullable></PropertyGroup><ItemGroup><ProjectReference Include="$GITHUB_WORKSPACE/FaceShield.csproj" /></ItemGroup></Project>
          EOF
          cat > "$work/Program.cs" <<'EOF'
          using System;
          using System.Reflection;
          using FaceShield.Services.Video;

          var asm = typeof(VideoExportService).Assembly;
          var fidelity = asm.GetType("FaceShield.Services.Video.VideoExportFidelityPolicy")!;
          var known = fidelity.GetMethod("ResolveKnownSourceTargetBitrate", BindingFlags.NonPublic | BindingFlags.Static)!;
          int Target(long source, int floor) => (int)known.Invoke(null, new object[] { source, floor })!;
          if (Target(800_000, 6_000_000) != 1_000_000) throw new Exception("800k source guardrail mismatch");
          if (Target(1_800_000, 6_000_000) != 2_250_000) throw new Exception("1.8m source guardrail mismatch");
          if (Target(10_000_000, 6_000_000) != 10_000_000) throw new Exception("source above floor mismatch");
          if (Target(4_000_000, 10_000_000) != 5_000_000) throw new Exception("1.25x cap mismatch");

          var selection = asm.GetType("FaceShield.Services.Video.VideoEncoderSelectionPolicy")!;
          var should = selection.GetMethod("ShouldApplySoftwareRateGuardrail", BindingFlags.NonPublic | BindingFlags.Static)!;
          bool Guard(string name, long source) => (bool)should.Invoke(null, new object[] { name, source })!;
          if (!Guard("libx264", 1_000_000) || !Guard("libx265", 1_000_000)) throw new Exception("software CRF guardrail missing");
          if (Guard("libx264rgb", 1_000_000)) throw new Exception("RGB path must remain unbounded by this guardrail");
          if (Guard("libx264", 0) || Guard("h264_nvenc", 1_000_000)) throw new Exception("guardrail scope mismatch");
          Console.WriteLine("[ExportRatePolicy] PASS");
          EOF
          dotnet run --project "$work/Test.csproj" -c Release -p:UseAppHost=false --nologo

      - name: Release build
        run: dotnet build FaceShield.csproj -c Release -p:UseAppHost=false --nologo

      - name: Commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-export-rate-guardrail.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Services/Video/VideoExportFidelityPolicy.cs Services/Video/VideoEncoderSelectionPolicy.cs Services/Video/VideoEncoderContextPolicy.cs Services/Video/VideoExportService.cs .github/workflows/temporary-export-rate-guardrail.yml
          git commit -m "Bound export bitrate growth to source rate"
          git push origin HEAD:refactor/ownership-workspace-hardening
