name: Temporary Persistence P1 Verification

on:
  push:
    branches:
      - refactor/ownership-workspace-hardening
    paths:
      - '.github/workflows/tmp-persistence-p1.yml'

permissions:
  contents: write

jobs:
  windows_verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply P1 patch
        run: python scripts/.tmp-apply-persistence-p1.py
      - name: Diff check
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore
        run: dotnet restore FaceShield.csproj
      - name: Release build
        run: dotnet build FaceShield.csproj -c Release --no-restore
      - name: Persistence race harness
        shell: pwsh
        run: pwsh -NoProfile -File scripts/.tmp-verify-persistence-p1.ps1
      - name: Existing focused regressions
        shell: pwsh
        run: |
          if (Test-Path scripts/verify-face-track-postprocess.ps1) {
            pwsh -NoProfile -File scripts/verify-face-track-postprocess.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (Test-Path scripts/verify-export-quality-presets.ps1) {
            pwsh -NoProfile -File scripts/verify-export-quality-presets.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  macos_verify:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply P1 patch
        run: python scripts/.tmp-apply-persistence-p1.py
      - name: Diff check
        run: git diff --check
      - name: Restore
        run: dotnet restore FaceShield.csproj
      - name: Release build
        run: dotnet build FaceShield.csproj -c Release --no-restore

  commit_fix:
    needs: [windows_verify, macos_verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ownership-workspace-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified patch
        run: python scripts/.tmp-apply-persistence-p1.py
      - name: Remove temporary verification files
        run: |
          rm -f scripts/.tmp-apply-persistence-p1.py
          rm -f scripts/.tmp-verify-persistence-p1.ps1
          rm -f .github/workflows/tmp-persistence-p1.yml
      - name: Verify final diff
        run: |
          git diff --check
          test ! -e scripts/.tmp-apply-persistence-p1.py
          test ! -e scripts/.tmp-verify-persistence-p1.ps1
          test ! -e .github/workflows/tmp-persistence-p1.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix persistence finalization and cleanup races'
          git push origin HEAD:refactor/ownership-workspace-hardening
