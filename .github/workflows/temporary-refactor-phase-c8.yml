name: Temporary Refactor Phase C8

on:
  push:
    branches:
      - refactor/ownership-workspace-hardening

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply video export outer extraction
        run: python3 scripts/temporary_refactor_phase_c8.py

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          git config core.whitespace cr-at-eol
          git diff --check
          grep -q 'class VideoExportAttemptCoordinator' Services/Video/VideoExportAttemptCoordinator.cs
          grep -q 'VideoExportAttemptCoordinator.Execute' Services/Video/VideoExportService.cs
          grep -q 'CommitStagedOutput' Services/Video/VideoExportStagingPolicy.cs
          grep -q 'VideoExportStagingPolicy.CommitStagedOutput' Services/Video/VideoExportService.cs
          if grep -q 'mode=fallback-safe로 재시도' Services/Video/VideoExportService.cs; then exit 1; fi
          if grep -q 'File.Replace(' Services/Video/VideoExportService.cs; then exit 1; fi
          if grep -q 'outputCommitTimer' Services/Video/VideoExportService.cs; then exit 1; fi

      - name: Build Release
        run: dotnet build FaceShield.csproj -c Release -p:UseAppHost=false --nologo

      - name: Commit verified phase
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/temporary_refactor_phase_c8.py
          rm -f .github/workflows/temporary-refactor-phase-c8.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract video export outer coordination'
          git push origin HEAD:refactor/ownership-workspace-hardening
