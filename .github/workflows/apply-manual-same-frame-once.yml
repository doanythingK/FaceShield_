name: One-shot exact manual-only overlap correction

on:
  push:
    branches:
      - refactor/manual-overlay-workflow
    paths:
      - .github/workflows/apply-manual-same-frame-once.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.ref == 'refs/heads/refactor/manual-overlay-workflow'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply guarded manual raster and promotion changes
        run: python3 scripts/apply-manual-inherited-overlap-once.py
      - name: Restore and build production application
        run: |
          dotnet restore FaceShield.csproj -r osx-arm64
          dotnet build FaceShield.csproj -c Release -r osx-arm64 --no-restore -p:ContinuousIntegrationBuild=true
      - name: Verify overlay, manual tracking and overlap regression
        run: |
          bash scripts/verify-manual-overlay.sh
          bash scripts/verify-manual-pyramid.sh
          bash scripts/verify-manual-tracking-integration.sh
          git diff --check
      - name: Commit verified changes and remove one-shot staging
        run: |
          git rm -- .github/workflows/apply-manual-same-frame-once.yml scripts/apply-manual-inherited-overlap-once.py
          git add -- Services/Video/FrameMaskProvider.cs Services/Video/ManualMaskKeyframeTimeline.cs Services/Video/ManualTrackingSourceSelection.cs ViewModels/Workspace/FramePreviewViewModel.ManualTracking.cs scripts/manual-auto-overlap-integration.cs.txt
          git -c user.name='FaceShield CI' -c user.email='actions@users.noreply.github.com' commit -m 'fix: reconstruct exact manual-only track across overlapping Auto masks'
          git push origin HEAD:refactor/manual-overlay-workflow
