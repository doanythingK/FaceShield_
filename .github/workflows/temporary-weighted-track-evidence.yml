name: Temporary Weighted Track Evidence

on:
  push:
    branches:
      - refactor/ownership-workspace-hardening

permissions:
  contents: write

jobs:
  patch-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply weighted track evidence patch
        run: python scripts/temporary-weighted-track-evidence-patch.py

      - name: Source invariants
        shell: python
        run: |
          from pathlib import Path
          builder = Path('Services/Analysis/FaceTrackBuilder.cs').read_text(encoding='utf-8')
          interp = Path('Services/Analysis/FaceTrackInterpolator.cs').read_text(encoding='utf-8')
          post = Path('Services/Analysis/AutoMaskTemporalPostProcessor.cs').read_text(encoding='utf-8')
          for marker, text in [
              ('FaceTrackEvidenceScorer', builder),
              ('EnableWeightedTrackEvidence', builder),
              ('MinConfirmedTrackEvidenceScore', builder),
              ('LowEvidenceRejectScore', builder),
              ('MaxStrongTrackLostFillFrames', builder),
              ('RemoveLowEvidenceTracks', interp),
              ('ResolveLostFillFrames', interp),
              ('action=reject', interp),
              ('action=extend-hold', interp),
              ('LowEvidenceRejectScore = cleanupYoloFalsePositives ? 0.64 : 0.0', post),
              ('MaxStrongTrackLostFillFrames = cleanupYoloFalsePositives ? 12 : 0', post),
              ('MaxStrongTrackLostFillFrames = 10', post),
          ]:
              if marker not in text:
                  raise SystemExit(f'missing invariant: {marker}')

      - name: Diff check
        run: git diff --check

      - name: Existing face-track regression
        shell: pwsh
        run: ./scripts/verify-face-track-postprocess.ps1

      - name: Weighted evidence regression
        shell: pwsh
        run: ./scripts/verify-yolo-weighted-track-evidence.ps1

      - name: Release build
        run: dotnet build FaceShield.csproj -c Release -p:UseAppHost=false --nologo

      - name: Commit verified source
        shell: pwsh
        run: |
          Remove-Item scripts/temporary-weighted-track-evidence-patch.py -Force
          Remove-Item .github/workflows/temporary-weighted-track-evidence.yml -Force
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff check failed" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Services/Analysis/FaceTrackBuilder.cs Services/Analysis/FaceTrackInterpolator.cs Services/Analysis/AutoMaskTemporalPostProcessor.cs scripts/verify-yolo-weighted-track-evidence.ps1 scripts/temporary-weighted-track-evidence-patch.py .github/workflows/temporary-weighted-track-evidence.yml
          git commit -m "Add weighted face track hysteresis"
          if ($LASTEXITCODE -ne 0) { throw "commit failed" }
          git push origin HEAD:refactor/ownership-workspace-hardening
          if ($LASTEXITCODE -ne 0) { throw "push failed" }
