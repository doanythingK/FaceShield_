name: Temporary Auto Privacy Stability

on:
  push:
    branches:
      - refactor/ownership-workspace-hardening

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Patch temporal privacy policy
        shell: python
        run: |
          from pathlib import Path

          temporal = Path('Services/Analysis/AutoMaskTemporalPostProcessor.cs')
          text = temporal.read_text(encoding='utf-8-sig').replace('\r\n', '\n')
          start = text.index('            if (continuityOnly)')
          end = text.index('            if (profile == FaceFilterProfile.Yolo)', start)
          block = text[start:end]

          replacements = {
              '                return new FaceTrackPostProcessOptions\n': '                bool cleanupYoloFalsePositives = profile == FaceFilterProfile.Yolo;\n                return new FaceTrackPostProcessOptions\n',
              '                    MaxLostFillFrames = 3,': '                    MaxLostFillFrames = 8,',
              '                    AllowSmallTrackLostFill = false,': '                    AllowSmallTrackLostFill = true,',
              '                    DropShortTrackMaxDetections = 0,': '                    DropShortTrackMaxDetections = cleanupYoloFalsePositives ? 2 : 0,',
              '                    DropShortSmallTrackMaxDetections = 0,': '                    DropShortSmallTrackMaxDetections = cleanupYoloFalsePositives ? 3 : 0,',
              '                    ShortTrackMaxConfidence = 0f,': '                    ShortTrackMaxConfidence = cleanupYoloFalsePositives ? 0.48f : 0f,',
              '                    DropSparseTrackMaxDetections = 0,': '                    DropSparseTrackMaxDetections = cleanupYoloFalsePositives ? 3 : 0,',
              '                    DropSparseTrackMaxDensity = 0f,': '                    DropSparseTrackMaxDensity = cleanupYoloFalsePositives ? 0.42 : 0.0,',
              '                    SparseTrackMaxConfidence = 0f,': '                    SparseTrackMaxConfidence = cleanupYoloFalsePositives ? 0.56f : 0f,',
              '                    EdgeLostFillMaxConfidence = 0.60f,': '                    EdgeLostFillMaxConfidence = 0f,',
              '                    MaxCenterShiftRatio = 0.55,': '                    MaxCenterShiftRatio = cleanupYoloFalsePositives ? 0.72 : 0.55,',
              '                    MaxConfirmedTrackBridgeCenterShiftRatio = 0.90,': '                    MaxConfirmedTrackBridgeCenterShiftRatio = cleanupYoloFalsePositives ? 1.20 : 0.90,'
          }
          for old, new in replacements.items():
              if block.count(old) != 1:
                  raise SystemExit(f'continuity marker count mismatch: {old!r} count={block.count(old)}')
              block = block.replace(old, new, 1)
          text = text[:start] + block + text[end:]

          yolo_start = text.index('            if (profile == FaceFilterProfile.Yolo)')
          yolo_end = text.index('            return new FaceTrackPostProcessOptions', yolo_start + 1)
          yolo = text[yolo_start:yolo_end]
          if yolo.count('                    MaxLostFillFrames = 0,') != 1:
              raise SystemExit('full YOLO MaxLostFillFrames marker mismatch')
          yolo = yolo.replace(
              '                    MaxLostFillFrames = 0,',
              '                    MaxLostFillFrames = YoloConfirmedTrackHoldFrames,', 1)
          if yolo.count('                    EdgeLostFillMaxConfidence = 0.60f,') != 1:
              raise SystemExit('full YOLO EdgeLostFill marker mismatch')
          yolo = yolo.replace(
              '                    EdgeLostFillMaxConfidence = 0.60f,',
              '                    EdgeLostFillMaxConfidence = 0f,', 1)
          text = text[:yolo_start] + yolo + text[yolo_end:]
          temporal.write_text(text, encoding='utf-8', newline='\n')

          interpolator = Path('Services/Analysis/FaceTrackInterpolator.cs')
          text = interpolator.read_text(encoding='utf-8-sig').replace('\r\n', '\n')
          old = '''                bool removeShortWeak = track.DetectionCount <= options.DropShortTrackMaxDetections &&\n                    track.MaxConfidence < options.ShortTrackMaxConfidence;\n                bool removeShortSmall = track.DetectionCount <= options.DropShortSmallTrackMaxDetections &&\n                    IsSmallTrack(track, options) &&\n                    !CouldBePartialFace(track, tracks, options);'''
          new = '''                bool couldBePartialFace = CouldBePartialFace(track, tracks, options);\n                bool removeShortWeak = track.DetectionCount <= options.DropShortTrackMaxDetections &&\n                    track.MaxConfidence < options.ShortTrackMaxConfidence &&\n                    !couldBePartialFace;\n                bool removeShortSmall = track.DetectionCount <= options.DropShortSmallTrackMaxDetections &&\n                    IsSmallTrack(track, options) &&\n                    !couldBePartialFace;'''
          if text.count(old) != 1:
              raise SystemExit(f'short cleanup marker mismatch count={text.count(old)}')
          text = text.replace(old, new, 1)

          lost_start = text.index('        private static int FillConfirmedLostFrames(')
          lost_end = text.index('        private static bool CrossesSceneCut(', lost_start)
          lost = text[lost_start:lost_end]
          old_guard = '''                    if (!IsMostlyInside(predicted, last.Size))\n                        break;'''
          if lost.count(old_guard) != 1:
              raise SystemExit(f'lost-fill guard mismatch count={lost.count(old_guard)}')
          lost = lost.replace(
              old_guard,
              '''                    if (!IntersectsFrame(predicted, last.Size))\n                        break;''', 1)
          text = text[:lost_start] + lost + text[lost_end:]

          helper_marker = '        private static bool IsMostlyInside(Rect rect, PixelSize size)\n'
          if text.count(helper_marker) != 1:
              raise SystemExit(f'IsMostlyInside marker mismatch count={text.count(helper_marker)}')
          helper = '''        private static bool IntersectsFrame(Rect rect, PixelSize size)\n        {\n            if (size.Width <= 0 || size.Height <= 0 || rect.Width <= 0 || rect.Height <= 0)\n                return false;\n\n            return rect.Right > 0 &&\n                rect.Bottom > 0 &&\n                rect.X < size.Width &&\n                rect.Y < size.Height;\n        }\n\n'''
          text = text.replace(helper_marker, helper + helper_marker, 1)
          interpolator.write_text(text, encoding='utf-8', newline='\n')

      - name: Source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MaxLostFillFrames = 8' Services/Analysis/AutoMaskTemporalPostProcessor.cs
          grep -q 'MaxLostFillFrames = YoloConfirmedTrackHoldFrames' Services/Analysis/AutoMaskTemporalPostProcessor.cs
          test "$(grep -c 'EdgeLostFillMaxConfidence = 0f' Services/Analysis/AutoMaskTemporalPostProcessor.cs)" -ge 2
          grep -q 'cleanupYoloFalsePositives ? 2 : 0' Services/Analysis/AutoMaskTemporalPostProcessor.cs
          grep -q 'bool couldBePartialFace = CouldBePartialFace' Services/Analysis/FaceTrackInterpolator.cs
          grep -q 'if (!IntersectsFrame(predicted, last.Size))' Services/Analysis/FaceTrackInterpolator.cs
          grep -q 'if (!IsMostlyInside(predicted, first.Size))' Services/Analysis/FaceTrackInterpolator.cs
          grep -q 'CrossesSceneCut(lastFrame, frameIndex, blockedSceneCutStarts)' Services/Analysis/FaceTrackInterpolator.cs
          grep -q 'if (hasStoredMask\[frameIndex\])' Services/Analysis/FaceTrackInterpolator.cs
          grep -q 'CreateSparseFaceMaskWorkingCopy' Services/Analysis/AutoMaskGenerator.SparseParallel.cs
          ! grep -q 'CreateSnapshot(' Services/Analysis/AutoMaskGenerator.SparseParallel.cs
          git diff --check

      - name: Privacy continuity harness
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/privacy-continuity"
          mkdir -p "$work"
          cat > "$work/PrivacyContinuity.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="$GITHUB_WORKSPACE/FaceShield.csproj" />
            </ItemGroup>
          </Project>
          EOF
          cat > "$work/Program.cs" <<'EOF'
          using System;
          using Avalonia;
          using FaceShield.Services.Analysis;
          using FaceShield.Services.Video;

          var size = new PixelSize(640, 360);
          var options = AutoMaskTemporalPostProcessor.BuildTrackPostProcessOptions(
              FaceFilterProfile.Yolo,
              continuityOnly: true);
          if (options.MaxLostFillFrames != 8 || options.EdgeLostFillMaxConfidence != 0)
              throw new InvalidOperationException("Tracked privacy tail policy mismatch.");
          if (options.DropShortTrackMaxDetections != 2 || options.DropSparseTrackMaxDetections != 3)
              throw new InvalidOperationException("Tracked YOLO cleanup policy mismatch.");

          var exitProvider = new FrameMaskProvider();
          exitProvider.SetFaceRects(10, new[] { new Rect(460, 120, 100, 100) }, size, 0.74f, new[] { 0.74f });
          exitProvider.SetFaceRects(11, new[] { new Rect(500, 120, 100, 100) }, size, 0.62f, new[] { 0.62f });
          exitProvider.SetFaceRects(12, new[] { new Rect(540, 120, 100, 100) }, size, 0.45f, new[] { 0.45f });
          var exitResult = new FaceTrackInterpolator().Apply(exitProvider, 24, options);
          foreach (int frame in new[] { 13, 14 })
          {
              if (!exitProvider.TryGetFaceMaskData(frame, out var data) || data.Faces.Count != 1)
                  throw new InvalidOperationException($"Partial exit face lost at frame {frame}.");
          }
          if (exitProvider.TryGetFaceMaskData(15, out var outside) && outside.Faces.Count > 0)
              throw new InvalidOperationException("Exit fill continued after face prediction left frame.");

          var fpProvider = new FrameMaskProvider();
          fpProvider.SetFaceRects(5, new[] { new Rect(260, 150, 70, 70) }, size, 0.42f, new[] { 0.42f });
          fpProvider.SetFaceRects(6, new[] { new Rect(263, 151, 70, 70) }, size, 0.43f, new[] { 0.43f });
          var fpResult = new FaceTrackInterpolator().Apply(fpProvider, 12, options);
          if ((fpProvider.TryGetFaceMaskData(5, out var fp5) && fp5.Faces.Count > 0) ||
              (fpProvider.TryGetFaceMaskData(6, out var fp6) && fp6.Faces.Count > 0))
              throw new InvalidOperationException("Weak central short false-positive track remained.");

          var edgeProvider = new FrameMaskProvider();
          edgeProvider.SetFaceRects(5, new[] { new Rect(0, 150, 70, 70) }, size, 0.42f, new[] { 0.42f });
          edgeProvider.SetFaceRects(6, new[] { new Rect(3, 151, 70, 70) }, size, 0.43f, new[] { 0.43f });
          new FaceTrackInterpolator().Apply(edgeProvider, 12, options);
          if (!edgeProvider.TryGetFaceMaskData(5, out var edge5) || edge5.Faces.Count != 1 ||
              !edgeProvider.TryGetFaceMaskData(6, out var edge6) || edge6.Faces.Count != 1)
              throw new InvalidOperationException("Edge partial-face short track was removed.");

          Console.WriteLine($"[PrivacyContinuity] PASS exitLost={exitResult.FilledLostFaces} fpRemoved={fpResult.RemovedShortFaces}");
          EOF
          dotnet run --project "$work/PrivacyContinuity.csproj" -c Release -p:UseAppHost=false --nologo

      - name: Existing face-track verifier
        shell: pwsh
        run: ./scripts/verify-face-track-postprocess.ps1

      - name: Release build
        run: dotnet build FaceShield.csproj -c Release -p:UseAppHost=false --nologo

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-auto-privacy-stability.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Services/Analysis/AutoMaskTemporalPostProcessor.cs Services/Analysis/FaceTrackInterpolator.cs .github/workflows/temporary-auto-privacy-stability.yml
          git commit -m "Harden auto blur temporal privacy continuity"
          git push origin HEAD:refactor/ownership-workspace-hardening
