name: One-shot manual preview cache integration

on:
  push:
    branches:
      - refactor/manual-overlay-workflow
    paths:
      - .github/workflows/apply-manual-preview-cache-once.yml

permissions:
  contents: write
  actions: write

jobs:
  verify-commit-and-dispatch:
    if: github.ref == 'refs/heads/refactor/manual-overlay-workflow'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply guarded code and update preview invalidation tests
        run: |
          python3 -m py_compile scripts/apply-manual-preview-cache-once.py
          python3 scripts/apply-manual-preview-cache-once.py
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              contents = path.read_text(encoding='utf-8')
              if contents.count(old) != 1:
                  raise RuntimeError(str(path) + ': expected one guarded anchor for ' + repr(old))
              path.write_text(contents.replace(old, new, 1), encoding='utf-8')
          verify = Path('scripts/verify-manual-overlay.sh')
          replace_once(verify,
              "'ManualMaskEditorLayer.ComposeWithAutomatic('",
              "'_manualPreviewCache.Compose('")
          cache = Path('Services/Video/ManualPreviewCompositeCache.cs')
          replace_once(cache,
              '    private int _frameIndex = -1;\n',
              '    private int _frameIndex = -1;\n    internal bool LastComposeWasFullUpdate { get; private set; }\n')
          replace_once(cache,
              '            _manualSource = manual;\n',
              '            LastComposeWasFullUpdate = fullUpdate;\n            _manualSource = manual;\n')
          replace_once(cache,
              '        _frameIndex = -1;\n    }\n\n    public void Dispose()',
              '        _frameIndex = -1;\n        LastComposeWasFullUpdate = false;\n    }\n\n    public void Dispose()')
          vm = Path('ViewModels/Workspace/FramePreviewViewModel.cs')
          replace_once(vm,
              '            previewMask = _manualPreviewCache.Compose(\n                _maskBitmap, automatic, _currentFrameIndex, dirtyRect);\n',
              '            previewMask = _manualPreviewCache.Compose(\n                _maskBitmap, automatic, _currentFrameIndex, dirtyRect);\n            if (_manualPreviewCache.LastComposeWasFullUpdate)\n                dirtyRect = null;\n')
          regression = Path('scripts/frame-mask-layer-regression.cs.txt')
          replace_once(regression,
              '    Assert(!ReferenceEquals(initial, rebuilt),\n        "Changing Auto did not invalidate the cached preview composite");',
              '    Assert(!ReferenceEquals(initial, rebuilt) && cache.LastComposeWasFullUpdate,\n        "Changing Auto did not invalidate the cached preview and require a full redraw");')
          print('PASS: updated stale connection check and full-redraw invalidation')
          PY
      - name: Build actual app
        run: |
          dotnet restore FaceShield.csproj -r osx-arm64
          dotnet build FaceShield.csproj -c Release -r osx-arm64 --no-restore -p:ContinuousIntegrationBuild=true
      - name: Run production mask and preview cache regressions
        run: bash scripts/verify-manual-overlay.sh
      - name: Verify patch and commit only after passing tests
        run: |
          git diff --check
          git rm -- .github/workflows/apply-manual-preview-cache-once.yml scripts/apply-manual-preview-cache-once.py
          git add -- Services/Video/ManualPreviewCompositeCache.cs ViewModels/Workspace/FramePreviewViewModel.cs scripts/frame-mask-layer-regression.cs.txt scripts/verify-manual-overlay.sh
          git -c user.name='FaceShield CI' -c user.email='actions@users.noreply.github.com' commit -m 'perf: reuse manual preview Auto raster and update only dirty region'
          git push origin HEAD:refactor/manual-overlay-workflow
      - name: Dispatch full Windows and macOS Quality Gate on validated commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY'] + '/actions/workflows/quality-gate.yml/dispatches'
          payload = json.dumps({'ref': 'refactor/manual-overlay-workflow'}).encode('utf-8')
          request = urllib.request.Request(url, data=payload, method='POST', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise RuntimeError('Quality Gate dispatch returned status ' + str(response.status))
          print('PASS: full cross-platform Quality Gate dispatched for validated HEAD')
          PY
