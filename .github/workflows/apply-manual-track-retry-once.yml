name: One-shot preserve verified tracking on retry

on:
  push:
    branches:
      - refactor/manual-overlay-workflow
    paths:
      - .github/workflows/apply-manual-track-retry-once.yml

permissions:
  contents: write
  actions: write

jobs:
  verify-and-commit:
    if: github.ref == 'refs/heads/refactor/manual-overlay-workflow'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Apply guarded tracking and regression changes
        run: |
          python3 -m py_compile scripts/apply-manual-track-retry-once.py
          python3 scripts/apply-manual-track-retry-once.py
      - name: Build production application
        run: |
          dotnet restore FaceShield.csproj -r osx-arm64
          dotnet build FaceShield.csproj -c Release -r osx-arm64 --no-restore -p:ContinuousIntegrationBuild=true
      - name: Test production preview, export and tracking persistence
        run: bash scripts/verify-manual-overlay.sh
      - name: Validate and push only verified code plus change log
        run: |
          git diff --check
          git rm -- .github/workflows/apply-manual-track-retry-once.yml scripts/apply-manual-track-retry-once.py
          git add -- Services/Video/ManualMaskKeyframeTimeline.cs ViewModels/Workspace/FramePreviewViewModel.ManualTracking.cs scripts/frame-mask-layer-regression.cs.txt docs/MANUAL_OVERLAY_WORKFLOW.md
          git -c user.name='FaceShield CI' -c user.email='actions@users.noreply.github.com' commit -m 'fix: preserve verified tracking when retry stops early; document why and tests'
          git push origin HEAD:refactor/manual-overlay-workflow
      - name: Request full Windows and macOS quality gate for committed code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY'] + '/actions/workflows/quality-gate.yml/dispatches'
          payload = json.dumps({'ref': 'refactor/manual-overlay-workflow'}).encode('utf-8')
          request = urllib.request.Request(url, data=payload, method='POST', headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise RuntimeError('Full Quality Gate dispatch failed: ' + str(response.status))
          print('PASS: requested cross-platform gate for verified branch HEAD')
          PY
