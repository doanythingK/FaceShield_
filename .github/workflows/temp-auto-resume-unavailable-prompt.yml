name: Temporary Auto Resume Notice Validation

on:
  push:
    branches:
      - "refactor/ownership-workspace-hardening"

permissions:
  contents: write

jobs:
  build-windows:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply Auto resume notice patch
        run: python scripts/patch-auto-resume-unavailable-prompt.py

      - name: Check patch
        shell: pwsh
        run: git diff --check

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FaceShield.csproj -r win-x64

      - name: Build
        run: dotnet build FaceShield.csproj -c Release -r win-x64 --no-restore -p:ContinuousIntegrationBuild=true

  build-macos:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply Auto resume notice patch
        run: python scripts/patch-auto-resume-unavailable-prompt.py

      - name: Check patch
        run: git diff --check

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FaceShield.csproj -r osx-arm64

      - name: Build
        run: dotnet build FaceShield.csproj -c Release -r osx-arm64 --no-restore -p:ContinuousIntegrationBuild=true

  finalize:
    if: github.actor != 'github-actions[bot]'
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/ownership-workspace-hardening
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply verified patch
        run: python scripts/patch-auto-resume-unavailable-prompt.py

      - name: Remove temporary validation files
        run: |
          rm scripts/patch-auto-resume-unavailable-prompt.py
          rm .github/workflows/temp-auto-resume-unavailable-prompt.yml

      - name: Verify final diff
        run: |
          git diff --check
          test ! -e scripts/patch-auto-resume-unavailable-prompt.py
          test ! -e .github/workflows/temp-auto-resume-unavailable-prompt.yml
          grep -F 'GetResumeUnavailableReason()' ViewModels/Workspace/AutoMaskRunCoordinator.cs
          grep -F 'AutoResumeUnavailableReason' ViewModels/Pages/WorkspaceViewModel.cs
          grep -F '자동 작업 이어하기 불가' ViewModels/Pages/HomePageViewModel.cs
          grep -F '현재 자동 작업은 처음부터 다시 시작됩니다.' ViewModels/Pages/HomePageViewModel.cs

      - name: Commit final source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: explain unavailable auto resume"
          git push origin HEAD:refactor/ownership-workspace-hardening
