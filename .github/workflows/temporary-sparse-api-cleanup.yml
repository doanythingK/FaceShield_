name: Temporary Sparse API Cleanup

on:
  push:
    branches:
      - docs/manual-blur-player-architecture
    paths:
      - .github/workflows/temporary-sparse-api-cleanup.yml

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted source patch
        run: python3 scripts/temporary_sparse_api_cleanup.py

      - name: Verify source shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'CreateSparseFaceMaskWorkingCopy' Services/Analysis/AutoMaskGenerator.cs
          grep -q 'SparseFaceMaskWorkingCopy maskProvider' Services/Analysis/SparseTrackingMaterializer.cs
          grep -q 'new HashSet<int>(_masks.Keys)' Services/Video/FrameMaskProvider.cs
          grep -q 'if (_version != source.SourceVersion)' Services/Video/FrameMaskProvider.cs
          grep -q 'return CloneBitmap(mask, CancellationToken.None);' Services/Video/FrameMaskProvider.cs
          grep -q 'internal bool TryGetStoredMaskBorrowed' Services/Video/FrameMaskProvider.cs
          grep -q 'ownedMask = maskProvider.GetFinalMask(decodedFrameOrdinal);' Services/Video/VideoFrameProcessingPolicy.cs
          grep -q 'using var ownedMaskScope = ownedMask;' Services/Video/VideoFrameProcessingPolicy.cs
          grep -q 'providerMask.Dispose();' ViewModels/Workspace/FramePreviewViewModel.cs
          if grep -R --include='*.cs' -n 'TryGetStoredMask(' Services ViewModels; then
            echo 'Legacy raw TryGetStoredMask API remains.' >&2
            exit 1
          fi
          if grep -R --include='*.cs' -n 'GetMaskEntries(' Services ViewModels; then
            echo 'Legacy raw GetMaskEntries API remains.' >&2
            exit 1
          fi

      - name: Build Release
        run: dotnet build FaceShield.csproj -c Release --nologo

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-sparse-api-cleanup.yml
          git rm scripts/temporary_sparse_api_cleanup.py
          git add Services/Video/FrameMaskProvider.cs \
                  Services/Analysis/SparseTrackingMaterializer.cs \
                  Services/Analysis/AutoMaskGenerator.cs \
                  Services/Video/IFrameMaskProvider.cs \
                  Services/Video/VideoFrameProcessingPolicy.cs \
                  ViewModels/Workspace/FramePreviewViewModel.cs \
                  QUALITY_STABILIZATION_REVIEW_FIXES.md
          git diff --cached --check
          git commit -m "Optimize sparse staging and bitmap ownership"
          git push origin HEAD:docs/manual-blur-player-architecture
