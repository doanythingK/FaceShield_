name: Temporary Sparse API Cleanup

on:
  push:
    branches:
      - docs/manual-blur-player-architecture
    paths:
      - .github/workflows/temporary-sparse-api-cleanup.yml

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply sparse and ownership cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read_lines(path):
              data = Path(path).read_bytes()
              had_bom = data.startswith(b'\xef\xbb\xbf')
              text = data.decode('utf-8-sig')
              return text.splitlines(keepends=True), had_bom

          def write_lines(path, lines, had_bom):
              data = ''.join(lines).encode('utf-8')
              if had_bom:
                  data = b'\xef\xbb\xbf' + data
              Path(path).write_bytes(data)

          def eol(line):
              if line.endswith('\r\n'):
                  return '\r\n'
              if line.endswith('\n'):
                  return '\n'
              return '\n'

          def find_one(lines, needle, start=0, end=None):
              if end is None:
                  end = len(lines)
              hits = [i for i in range(start, end) if needle in lines[i]]
              if len(hits) != 1:
                  raise RuntimeError(f"Expected exactly one {needle!r}, found {len(hits)}")
              return hits[0]

          def find_next(lines, needle, start, limit=80):
              for i in range(start, min(len(lines), start + limit)):
                  if needle in lines[i]:
                      return i
              raise RuntimeError(f"Could not find {needle!r} after {start}")

          def block(text, nl):
              return [(line + nl) for line in text.strip('\n').split('\n')] + [nl]

          # FrameMaskProvider: lightweight sparse working copy and explicit bitmap ownership.
          path = 'Services/Video/FrameMaskProvider.cs'
          lines, bom = read_lines(path)
          nl = eol(lines[0])

          version_idx = find_one(lines, 'private long _version;')
          if not any('SparseFaceMaskWorkingCopy' in line for line in lines):
              working_copy = '''
    internal sealed class SparseFaceMaskWorkingCopy
    {
        private readonly HashSet<int> _storedMaskFrames;
        private readonly Dictionary<int, FaceMaskData> _faceMasks;

        internal SparseFaceMaskWorkingCopy(
            long sourceVersion,
            HashSet<int> storedMaskFrames,
            Dictionary<int, FaceMaskData> faceMasks)
        {
            SourceVersion = sourceVersion;
            _storedMaskFrames = storedMaskFrames;
            _faceMasks = faceMasks;
        }

        internal long SourceVersion { get; }

        internal bool HasEntry(int frameIndex)
            => _storedMaskFrames.Contains(frameIndex) || _faceMasks.ContainsKey(frameIndex);

        internal void SetFaceRects(
            int frameIndex,
            IReadOnlyList<Rect> faces,
            PixelSize size,
            float? minConfidence = null,
            IReadOnlyList<float>? confidences = null)
        {
            if (_storedMaskFrames.Contains(frameIndex))
                return;

            Rect[] faceArray = faces == null ? Array.Empty<Rect>() : faces.ToArray();
            if (faceArray.Length == 0 || size.Width <= 0 || size.Height <= 0)
            {
                _faceMasks.Remove(frameIndex);
                return;
            }

            _faceMasks[frameIndex] = new FaceMaskData(
                size,
                faceArray,
                minConfidence,
                NormalizeConfidences(faceArray.Length, minConfidence, confidences));
        }

        internal Dictionary<int, FaceMaskData> ExportFaceMaskSnapshot(
            CancellationToken cancellationToken)
        {
            cancellationToken.ThrowIfCancellationRequested();
            var snapshot = new Dictionary<int, FaceMaskData>(_faceMasks.Count);
            foreach (var entry in _faceMasks)
            {
                cancellationToken.ThrowIfCancellationRequested();
                snapshot[entry.Key] = CloneFaceMaskData(entry.Value);
            }

            return snapshot;
        }
    }
'''
              lines[version_idx + 1:version_idx + 1] = [nl] + block(working_copy, nl)

          get_final = find_one(lines, 'public WriteableBitmap? GetFinalMask(int frameIndex)')
          has_entry = find_next(lines, 'public bool HasEntry(int frameIndex)', get_final, 40)
          final_block = '''
    public WriteableBitmap? GetFinalMask(int frameIndex)
    {
        lock (_stateGate)
        {
            if (_masks.TryGetValue(frameIndex, out var mask))
                return CloneBitmap(mask, CancellationToken.None);

            if (_faceMasks.TryGetValue(frameIndex, out var faces))
                return CreateMaskFromFaceRects(faces.Size, faces.Faces);

            return null;
        }
    }
'''
          lines[get_final:has_entry] = block(final_block, nl)

          raw_start = find_one(lines, 'public bool TryGetStoredMask(int frameIndex, out WriteableBitmap mask)')
          clone_start = find_next(lines, 'public bool TryCloneStoredMask(', raw_start, 20)
          borrowed_block = '''
    /// <summary>
    /// Returns a provider-owned bitmap reference for read-stable internal paths only.
    /// The caller must not dispose it and must ensure the provider is not mutated while it is in use.
    /// </summary>
    internal bool TryGetStoredMaskBorrowed(int frameIndex, out WriteableBitmap mask)
    {
        lock (_stateGate)
            return _masks.TryGetValue(frameIndex, out mask!);
    }
'''
          lines[raw_start:clone_start] = block(borrowed_block, nl)

          entries_start = find_one(lines, 'public IReadOnlyCollection<KeyValuePair<int, WriteableBitmap>> GetMaskEntries()')
          snapshot_start = find_next(lines, 'public IReadOnlyCollection<KeyValuePair<int, WriteableBitmap>> GetStoredMaskSnapshot(', entries_start, 30)
          del lines[entries_start:snapshot_start]

          create_snapshot = find_one(lines, 'public FrameMaskProvider CreateSnapshot()')
          sparse_factory = '''
    internal SparseFaceMaskWorkingCopy CreateSparseFaceMaskWorkingCopy(
        CancellationToken cancellationToken = default)
    {
        cancellationToken.ThrowIfCancellationRequested();
        lock (_stateGate)
        {
            cancellationToken.ThrowIfCancellationRequested();
            long sourceVersion = _version;
            var storedMaskFrames = new HashSet<int>(_masks.Keys);
            var faceMasks = new Dictionary<int, FaceMaskData>(_faceMasks.Count);
            foreach (var entry in _faceMasks)
            {
                cancellationToken.ThrowIfCancellationRequested();
                faceMasks[entry.Key] = CloneFaceMaskData(entry.Value);
            }

            return new SparseFaceMaskWorkingCopy(
                sourceVersion,
                storedMaskFrames,
                faceMasks);
        }
    }
'''
          lines[create_snapshot:create_snapshot] = block(sparse_factory, nl)

          provider_commit = find_one(lines, 'public void CommitFaceMasksFrom(')
          sparse_commit = '''
    internal void CommitFaceMasksFrom(
        SparseFaceMaskWorkingCopy source,
        CancellationToken cancellationToken = default)
    {
        if (source == null)
            throw new ArgumentNullException(nameof(source));

        var committedFaces = source.ExportFaceMaskSnapshot(cancellationToken);

        lock (_stateGate)
        {
            cancellationToken.ThrowIfCancellationRequested();
            if (_version != source.SourceVersion)
            {
                throw new InvalidOperationException(
                    "Mask provider changed while sparse Auto materialization was staged.");
            }

            _faceMasks.Clear();
            foreach (var entry in committedFaces)
            {
                // Stored/manual bitmap entries remain authoritative.
                if (_masks.ContainsKey(entry.Key))
                    continue;

                _faceMasks[entry.Key] = entry.Value;
            }

            // Once commit mutation starts, finish atomically rather than observing cancellation mid-commit.
            _version++;
        }
    }
'''
          lines[provider_commit:provider_commit] = block(sparse_commit, nl)
          write_lines(path, lines, bom)

          # Sparse materializer now targets the lightweight working copy.
          path = 'Services/Analysis/SparseTrackingMaterializer.cs'
          lines, bom = read_lines(path)
          sig = find_one(lines, 'FrameMaskProvider maskProvider,')
          lines[sig] = lines[sig].replace(
              'FrameMaskProvider maskProvider,',
              'FrameMaskProvider.SparseFaceMaskWorkingCopy maskProvider,')
          write_lines(path, lines, bom)

          # Sparse pipeline no longer deep-copies stored bitmaps.
          path = 'Services/Analysis/AutoMaskGenerator.cs'
          lines, bom = read_lines(path)
          snapshot_call = find_one(lines, 'using var sparseMaterializationProvider = _maskProvider.CreateSnapshot(')
          snapshot_end = find_next(lines, 'pipelineToken);', snapshot_call, 8)
          nl_auto = eol(lines[snapshot_call])
          indent = lines[snapshot_call][:len(lines[snapshot_call]) - len(lines[snapshot_call].lstrip())]
          lines[snapshot_call:snapshot_end + 1] = [
              indent + 'var sparseWorkingCopy = _maskProvider.CreateSparseFaceMaskWorkingCopy(pipelineToken);' + nl_auto
          ]
          materialize = find_next(lines, 'var materialized = SparseTrackingMaterializer.Materialize(', snapshot_call, 10)
          materialize_arg = find_next(lines, 'sparseMaterializationProvider,', materialize, 8)
          lines[materialize_arg] = lines[materialize_arg].replace('sparseMaterializationProvider,', 'sparseWorkingCopy,')
          commit = find_next(lines, '_maskProvider.CommitFaceMasksFrom(', materialize, 20)
          commit_end = find_next(lines, 'pipelineToken);', commit, 8)
          commit_indent = lines[commit][:len(lines[commit]) - len(lines[commit].lstrip())]
          lines[commit:commit_end + 1] = [
              commit_indent + '_maskProvider.CommitFaceMasksFrom(' + nl_auto,
              commit_indent + '    sparseWorkingCopy,' + nl_auto,
              commit_indent + '    pipelineToken);' + nl_auto,
          ]
          write_lines(path, lines, bom)

          # Public interface: GetFinalMask always returns a caller-owned bitmap.
          path = 'Services/Video/IFrameMaskProvider.cs'
          lines, bom = read_lines(path)
          export_comment = find_one(lines, '/// Export 시 사용할 최종 마스크.')
          if not any('Dispose' in line and '호출자' in line for line in lines[export_comment:export_comment + 6]):
              nl_i = eol(lines[export_comment])
              indent = lines[export_comment][:len(lines[export_comment]) - len(lines[export_comment].lstrip())]
              lines.insert(export_comment + 2, indent + '/// 반환된 bitmap은 호출자가 소유하며 사용 후 Dispose해야 합니다.' + nl_i)
          write_lines(path, lines, bom)

          # Export keeps its fast internal borrowed path for FrameMaskProvider snapshots,
          # while generic IFrameMaskProvider masks follow the caller-owned contract.
          path = 'Services/Video/VideoFrameProcessingPolicy.cs'
          lines, bom = read_lines(path)
          mask_decl = find_one(lines, 'WriteableBitmap? mask = null;')
          nl_v = eol(lines[mask_decl])
          indent = lines[mask_decl][:len(lines[mask_decl]) - len(lines[mask_decl].lstrip())]
          lines.insert(mask_decl + 1, indent + 'WriteableBitmap? ownedMask = null;' + nl_v)
          borrowed = find_one(lines, 'provider.TryGetStoredMask(decodedFrameOrdinal, out var stored)')
          lines[borrowed] = lines[borrowed].replace('TryGetStoredMask(', 'TryGetStoredMaskBorrowed(')
          fallback = find_one(lines, 'mask = maskProvider.GetFinalMask(decodedFrameOrdinal);')
          fallback_indent = lines[fallback][:len(lines[fallback]) - len(lines[fallback].lstrip())]
          lines[fallback:fallback + 1] = [
              fallback_indent + 'ownedMask = maskProvider.GetFinalMask(decodedFrameOrdinal);' + nl_v,
              fallback_indent + 'mask = ownedMask;' + nl_v,
          ]
          native = find_next(lines, 'bool nativeYuvApplied = false;', fallback, 12)
          lines.insert(native, indent + 'using var ownedMaskScope = ownedMask;' + nl_v)
          write_lines(path, lines, bom)

          # Preview fallback receives ownership directly and avoids an unnecessary second clone.
          path = 'ViewModels/Workspace/FramePreviewViewModel.cs'
          lines, bom = read_lines(path)
          provider_mask = find_one(lines, 'var providerMask = _maskProvider?.GetFinalMask(frameIndex);')
          clone_return = find_next(lines, 'return CloneBitmap(providerMask);', provider_mask, 16)
          nl_p = eol(lines[provider_mask])
          pindent = lines[provider_mask][:len(lines[provider_mask]) - len(lines[provider_mask].lstrip())]
          preview_block = [
              pindent + 'var providerMask = _maskProvider?.GetFinalMask(frameIndex);' + nl_p,
              pindent + 'if (providerMask == null)' + nl_p,
              pindent + '    return null;' + nl_p,
              nl_p,
              pindent + 'if (providerMask.PixelSize.Width != frame.PixelSize.Width ||' + nl_p,
              pindent + '    providerMask.PixelSize.Height != frame.PixelSize.Height)' + nl_p,
              pindent + '{' + nl_p,
              pindent + '    providerMask.Dispose();' + nl_p,
              pindent + '    return null;' + nl_p,
              pindent + '}' + nl_p,
              nl_p,
              pindent + 'return providerMask;' + nl_p,
          ]
          lines[provider_mask:clone_return + 1] = preview_block
          write_lines(path, lines, bom)

          # Document the design follow-up.
          doc = Path('QUALITY_STABILIZATION_REVIEW_FIXES.md')
          data = doc.read_bytes()
          had_bom = data.startswith(b'\xef\xbb\xbf')
          text = data.decode('utf-8-sig')
          nl_d = '\r\n' if text.count('\r\n') > text.count('\n') / 2 else '\n'
          heading = '## Follow-up: Sparse working-copy cost and bitmap ownership (2026-09-04)'
          if heading not in text:
              section = f'''{nl_d}---{nl_d}{nl_d}{heading}{nl_d}{nl_d}- Sparse materialization now uses a lightweight transactional working copy containing cloned face-mask data, stored-mask frame presence, and the source provider version. Stored `WriteableBitmap` pixels are not copied for sparse staging.{nl_d}- Sparse commit still rejects a changed source version before mutation, so concurrent/manual edits cannot be silently overwritten.{nl_d}- Public final-mask reads now have one ownership contract: `GetFinalMask()` returns a caller-owned bitmap that must be disposed.{nl_d}- Raw stored-bitmap access was reduced to an internal, explicitly borrowed export path; `GetMaskEntries()` was removed. Safe public reads use clone/snapshot APIs.{nl_d}- Commit cancellation semantics are unchanged: cancellation is checked before mutation, then the atomic commit section completes without mid-commit cancellation checks.{nl_d}'''
              text = text.rstrip('\r\n') + nl_d + section
              out = text.encode('utf-8')
              if had_bom:
                  out = b'\xef\xbb\xbf' + out
              doc.write_bytes(out)
          PY

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path

          provider = Path('Services/Video/FrameMaskProvider.cs').read_text(encoding='utf-8-sig')
          auto = Path('Services/Analysis/AutoMaskGenerator.cs').read_text(encoding='utf-8-sig')
          sparse = Path('Services/Analysis/SparseTrackingMaterializer.cs').read_text(encoding='utf-8-sig')
          policy = Path('Services/Video/VideoFrameProcessingPolicy.cs').read_text(encoding='utf-8-sig')
          preview = Path('ViewModels/Workspace/FramePreviewViewModel.cs').read_text(encoding='utf-8-sig')
          contract = Path('Services/Video/IFrameMaskProvider.cs').read_text(encoding='utf-8-sig')

          assert 'public bool TryGetStoredMask(' not in provider
          assert 'public IReadOnlyCollection<KeyValuePair<int, WriteableBitmap>> GetMaskEntries()' not in provider
          assert 'internal bool TryGetStoredMaskBorrowed(' in provider
          assert 'return CloneBitmap(mask, CancellationToken.None);' in provider
          assert 'CreateSparseFaceMaskWorkingCopy' in provider
          factory = provider.index('internal SparseFaceMaskWorkingCopy CreateSparseFaceMaskWorkingCopy')
          factory_end = provider.index('public FrameMaskProvider CreateSnapshot()', factory)
          assert 'CloneBitmap(' not in provider[factory:factory_end]
          assert 'new HashSet<int>(_masks.Keys)' in provider[factory:factory_end]
          assert 'CloneFaceMaskData(entry.Value)' in provider[factory:factory_end]
          assert 'if (_version != source.SourceVersion)' in provider
          assert 'SparseFaceMaskWorkingCopy maskProvider' in sparse
          materialize = auto.index('var materialized = SparseTrackingMaterializer.Materialize(')
          window = auto[max(0, materialize - 700):materialize + 700]
          assert 'CreateSparseFaceMaskWorkingCopy' in window
          assert 'CreateSnapshot(' not in window
          assert 'TryGetStoredMaskBorrowed(decodedFrameOrdinal' in policy
          assert 'ownedMask = maskProvider.GetFinalMask(decodedFrameOrdinal);' in policy
          assert 'using var ownedMaskScope = ownedMask;' in policy
          assert 'return providerMask;' in preview and 'providerMask.Dispose();' in preview
          assert '호출자가 소유' in contract and 'Dispose' in contract
          print('Sparse/ownership source invariants passed.')
          PY

          if grep -R --include='*.cs' --exclude='merged_sources.txt' -n 'TryGetStoredMask(' Services ViewModels 2>/dev/null; then
            echo 'Unexpected legacy TryGetStoredMask call remains.' >&2
            exit 1
          fi
          if grep -R --include='*.cs' --exclude='merged_sources.txt' -n 'GetMaskEntries(' Services ViewModels 2>/dev/null; then
            echo 'Unexpected raw GetMaskEntries call remains.' >&2
            exit 1
          fi

      - name: Build
        shell: bash
        run: dotnet build FaceShield.csproj -c Release --nologo

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-sparse-api-cleanup.yml
          git add Services/Video/FrameMaskProvider.cs \
                  Services/Analysis/SparseTrackingMaterializer.cs \
                  Services/Analysis/AutoMaskGenerator.cs \
                  Services/Video/IFrameMaskProvider.cs \
                  Services/Video/VideoFrameProcessingPolicy.cs \
                  ViewModels/Workspace/FramePreviewViewModel.cs \
                  QUALITY_STABILIZATION_REVIEW_FIXES.md
          git diff --cached --check
          git commit -m "Optimize sparse staging and bitmap ownership"
          git push origin HEAD:docs/manual-blur-player-architecture
