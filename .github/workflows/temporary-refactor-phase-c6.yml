name: Temporary Refactor Phase C6

on:
  push:
    branches:
      - refactor/ownership-workspace-hardening

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply timeline request extraction
        run: python3 scripts/temporary_refactor_phase_c6.py

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          git config core.whitespace cr-at-eol
          git diff --check
          grep -q 'class TimelineFrameStripRequestCoordinator' Controls/TimelineFrameStripRequestCoordinator.cs
          grep -q 'private readonly TimelineFrameStripRequestCoordinator _requests' Controls/TimelineFrameStrip.cs
          grep -q '_requests.RequestExactFrameSelection' Controls/TimelineFrameStrip.cs
          grep -q '_requests.RequestSelectedFrameTimestamp' Controls/TimelineFrameStrip.cs
          grep -q '_requests.RequestIssueViewportMapping' Controls/TimelineFrameStrip.cs
          grep -q '_requests.RequestIssueFrameMapping' Controls/TimelineFrameStrip.cs
          if grep -q '_selectionRequestCts' Controls/TimelineFrameStrip.cs; then exit 1; fi
          if grep -q '_selectedPtsRequestCts' Controls/TimelineFrameStrip.cs; then exit 1; fi
          if grep -q '_issueViewportRequestCts' Controls/TimelineFrameStrip.cs; then exit 1; fi
          if grep -q '_pendingThumbnails' Controls/TimelineFrameStrip.cs; then exit 1; fi

      - name: Build Release
        run: dotnet build FaceShield.csproj -c Release -p:UseAppHost=false --nologo

      - name: Commit verified phase
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/temporary_refactor_phase_c6.py
          rm -f .github/workflows/temporary-refactor-phase-c6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract timeline frame strip request coordination'
          git push origin HEAD:refactor/ownership-workspace-hardening
