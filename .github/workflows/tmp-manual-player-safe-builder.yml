name: Temporary Manual Player Safe Builder

on:
  push:
    branches:
      - "tmp/manual-player-phase12-safe-builder"

permissions:
  contents: write

concurrency:
  group: manual-player-safe-builder
  cancel-in-progress: false

env:
  BRANCH_NAME: tmp/manual-player-phase12-safe-builder

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply manual player phase 1-2
        run: python scripts/tmp-manual-player-phase12-runner.py

      - name: Apply lifetime hardening
        run: python scripts/tmp-manual-player-lifetime-fix.py

      - name: Verify source contract
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          required = {
              'Services/Video/FfFrameExtractor.cs': [
                  'TryGetLastDecodedPresentationIdentity',
              ],
              'Services/Video/Session/ManualFramePlayer.cs': [
                  'ManualFrameIdentity',
                  'TimestampOccurrence',
                  'using OperationLease operation = EnterOperation();',
                  'internal async ValueTask StopAndWaitAsync()',
                  'Task drainTask = BeginClose();',
                  '_decodeGate.Dispose();',
              ],
              'Services/Video/Session/VideoSession.cs': [
                  'enableManualPlayer',
                  'IAsyncDisposable',
                  'await ManualPlayer.DisposeAsync()',
              ],
              'ViewModels/Workspace/FramePreviewViewModel.cs': [
                  'LoadManualFrameAsync',
                  'RunManualSequentialPlaybackAsync',
                  'EnsureCurrentManualFrameEditable',
                  'CancelManualFrameLoadAndWaitAsync',
                  'StopManualOperationsAndWaitAsync',
              ],
              'ViewModels/Workspace/WorkspaceSessionPlaybackCoordinator.cs': [
                  'enableManualPlayer: _mode == WorkspaceMode.Manual',
              ],
              'ViewModels/Pages/HomePageViewModel.cs': [
                  'deferSessionInit: true',
                  'await vm.EnsureSessionInitializedAsync(',
              ],
              'ViewModels/Pages/WorkspaceViewModel.cs': [
                  'IsSessionLoading = true',
                  'await FramePreview.StopManualOperationsAndWaitAsync();',
              ],
              'Views/Pages/WorkspaceView.axaml': [
                  'IsSessionLoading',
              ],
              'Views/Workspace/FramePreviewView.axaml': [
                  'IsFrameLoading',
              ],
          }

          for path, needles in required.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{path}: missing {needle!r}')

          player = Path('Services/Video/Session/ManualFramePlayer.cs').read_text(encoding='utf-8')
          if player.count('_decodeGate.Dispose();') != 1:
              raise SystemExit('decode gate must have exactly one disposal site')
          if player.index('await drainTask.ConfigureAwait(false);') > player.index('_decodeGate.Dispose();'):
              raise SystemExit('decode gate disposal precedes operation drain')

          print('source contract ok')
          '@ | python -

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FaceShield.csproj -r win-x64

      - name: Build Release
        run: dotnet build FaceShield.csproj -c Release -r win-x64 --no-restore -p:ContinuousIntegrationBuild=true

  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Apply manual player phase 1-2
        run: python scripts/tmp-manual-player-phase12-runner.py

      - name: Apply lifetime hardening
        run: python scripts/tmp-manual-player-lifetime-fix.py

      - name: Verify source contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          required = {
              'Services/Video/FfFrameExtractor.cs': ['TryGetLastDecodedPresentationIdentity'],
              'Services/Video/Session/ManualFramePlayer.cs': [
                  'ManualFrameIdentity',
                  'TimestampOccurrence',
                  'using OperationLease operation = EnterOperation();',
                  'internal async ValueTask StopAndWaitAsync()',
              ],
              'Services/Video/Session/VideoSession.cs': [
                  'enableManualPlayer',
                  'IAsyncDisposable',
              ],
              'ViewModels/Workspace/FramePreviewViewModel.cs': [
                  'LoadManualFrameAsync',
                  'RunManualSequentialPlaybackAsync',
                  'CancelManualFrameLoadAndWaitAsync',
              ],
              'ViewModels/Pages/HomePageViewModel.cs': [
                  'deferSessionInit: true',
                  'await vm.EnsureSessionInitializedAsync(',
              ],
          }
          for path, needles in required.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{path}: missing {needle!r}')
          print('source contract ok')
          PY
          git diff --check

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore FaceShield.csproj -r osx-arm64

      - name: Build Release
        run: dotnet build FaceShield.csproj -c Release -r osx-arm64 --no-restore -p:ContinuousIntegrationBuild=true

  finalize:
    needs:
      - build-windows
      - build-macos
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Confirm builder branch has not moved
        shell: bash
        run: |
          git fetch origin "refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
          test "$(git rev-parse refs/remotes/origin/$BRANCH_NAME)" = "$GITHUB_SHA"

      - name: Rebuild validated product tree
        shell: bash
        run: |
          python scripts/tmp-manual-player-phase12-runner.py
          python scripts/tmp-manual-player-lifetime-fix.py
          git diff --check

      - name: Remove temporary builder material
        shell: bash
        run: |
          rm -f scripts/tmp-manual-player-phase12.py
          rm -f scripts/tmp-manual-player-phase12-runner.py
          rm -f scripts/tmp-manual-player-lifetime-fix.py
          rm -f .github/workflows/tmp-manual-player-safe-builder.yml
          test ! -e .github/workflows/tmp-manual-player-phase12.yml

      - name: Verify final product tree
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/tmp-manual-player-safe-builder.yml',
              'MANUAL_BLUR_PLAYER_ARCHITECTURE.md',
              'Services/Video/FfFrameExtractor.cs',
              'Services/Video/Session/ManualFramePlayer.cs',
              'Services/Video/Session/VideoSession.cs',
              'ViewModels/Pages/HomePageViewModel.cs',
              'ViewModels/Pages/WorkspaceViewModel.cs',
              'ViewModels/Workspace/FramePreviewViewModel.cs',
              'ViewModels/Workspace/WorkspaceSessionPlaybackCoordinator.cs',
              'Views/Pages/WorkspaceView.axaml',
              'Views/Workspace/FramePreviewView.axaml',
              'scripts/tmp-manual-player-lifetime-fix.py',
              'scripts/tmp-manual-player-phase12-runner.py',
              'scripts/tmp-manual-player-phase12.py',
          }
          actual = set(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines()))
          if actual != expected:
              raise SystemExit(f'unexpected final diff: {sorted(actual)}')
          PY
          git diff --check
          test ! -e scripts/tmp-manual-player-phase12.py
          test ! -e scripts/tmp-manual-player-phase12-runner.py
          test ! -e scripts/tmp-manual-player-lifetime-fix.py
          test ! -e .github/workflows/tmp-manual-player-safe-builder.yml
          test ! -e .github/workflows/tmp-manual-player-phase12.yml

      - name: Commit validated product tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: harden manual player lifetime and loading"
          git push origin HEAD:refs/heads/$BRANCH_NAME
